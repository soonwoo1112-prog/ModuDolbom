<!-- @dsCard group="Forms" height=330 subtitle="Field + Text Input: 기본, 오류, 비활성" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>TextField preview</title></head>
<body>
<div class="md-stack" style="max-width:400px">
  <div class="md-field"><label class="md-field__label" for="f1">강아지 이름</label><input class="md-input" id="f1" value="보리"></div>
  <div class="md-field"><label class="md-field__label" for="f2">만날 장소</label><input class="md-input" id="f2" aria-invalid="true" aria-describedby="f2e" placeholder="예: 101동 1층 현관"><div class="md-field__foot"><span class="md-field__error" id="f2e">만날 장소를 적어 주세요. 시터가 찾아올 곳이에요.</span></div></div>
  <div class="md-field"><label class="md-field__label" for="f3">시터에게 남길 말<em>선택</em></label><textarea class="md-input" id="f3" aria-describedby="f3c" placeholder="예: 산책 중 다른 강아지를 보면 짖어요"></textarea><div class="md-field__foot"><span>주의할 점을 알려 주면 좋아요.</span><span id="f3c" class="md-num">0/300</span></div></div>
</div>
</body>
</html>
