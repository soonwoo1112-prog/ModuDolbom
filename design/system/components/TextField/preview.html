<!-- @dsCard group="Forms" height=300 subtitle="입력창: 기본, 오류, 비활성" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>TextField preview</title></head>
<body>
<div class="md-stack" style="max-width:380px">
  <div class="md-field"><label class="md-field__label" for="f1">강아지 이름</label><input class="md-field__input" id="f1" value="보리"></div>
  <div class="md-field"><label class="md-field__label" for="f2">만날 장소</label><input class="md-field__input" id="f2" aria-invalid="true" aria-describedby="f2e" placeholder="예: 101동 1층 현관"><span class="md-field__error" id="f2e">만날 장소를 적어 주세요. 시터가 찾아올 곳이에요.</span></div>
  <div class="md-field"><label class="md-field__label" for="f3">주소</label><input class="md-field__input" id="f3" value="거주지 인증으로 채워져요" disabled><span class="md-field__help">주소는 거주지 인증에서만 바꿀 수 있어요.</span></div>
</div>
</body>
</html>
