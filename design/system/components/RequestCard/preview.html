<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>RequestCard preview</title></head>
<body>
<div class="md-stack" style="max-width:420px">
  <article class="md-card" style="box-shadow:var(--shadow-card)">
    <div class="md-sitter__head"><span class="md-chip md-chip--loud">새 요청</span><span class="md-caption">3분 전</span></div>
    <div style="display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center">
      <span class="md-photo" style="width:56px;height:56px">사진</span>
      <div><h3 class="md-title-2">보리, 중형견</h3><p class="md-label" style="margin:0">내일 오후 12:30부터 30분, 101동 1층 현관</p></div>
    </div>
    <div class="md-request__actions"><button class="md-btn md-btn--primary" type="button">대화창 열기</button><button class="md-btn" type="button">거절</button></div>
  </article>
</div>
</body>
</html>
