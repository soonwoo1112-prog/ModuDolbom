<!-- @dsCard group="Matching" height=520 subtitle="한 번에 여러 시터에게 요청하기" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>SitterCard preview</title></head>
<body>
<div style="max-width:420px">
<div class="md-stack">
  <p class="md-label" style="margin:0">조건에 맞는 시터 6명 중 2명을 골랐어요</p>
  <label class="md-card md-sitter">
    <input class="md-check" type="checkbox" checked aria-label="김하늘 시터 선택">
    <span class="md-photo">사진</span>
    <span class="md-sitter__body">
      <span class="md-sitter__head"><span class="md-title-2">김하늘</span><span class="md-num" style="font-weight:600">30분 15,000원</span></span>
      <span class="md-sitter__bio">점심시간에 산책할 수 있어요. 중형견 경험이 많아요.</span>
      <span class="md-tags"><span class="md-chip md-chip--apt">같은 아파트</span><span class="md-chip">전담 시터</span></span>
      <dl class="md-facts"><div><dt>거리</dt><dd>120m</dd></div><div><dt>리뷰</dt><dd>48개</dd></div><div><dt>재이용</dt><dd>12명</dd></div><div><dt>평균 답장</dt><dd>10분</dd></div></dl>
    </span>
  </label>
  <label class="md-card md-sitter">
    <input class="md-check" type="checkbox" checked aria-label="이도윤 시터 선택">
    <span class="md-photo">사진</span>
    <span class="md-sitter__body">
      <span class="md-sitter__head"><span class="md-title-2">이도윤</span><span class="md-num" style="font-weight:600">30분 12,000원</span></span>
      <span class="md-sitter__bio">수업 없는 화요일과 목요일에 산책해요.</span>
      <span class="md-tags"><span class="md-chip md-chip--new">새로 온 시터</span></span>
      <dl class="md-facts"><div><dt>거리</dt><dd>450m</dd></div><div><dt>리뷰</dt><dd>아직 없어요</dd></div><div><dt>재이용</dt><dd>0명</dd></div><div><dt>평균 답장</dt><dd>25분</dd></div></dl>
    </span>
  </label>
</div>
<div class="md-requestbar"><button class="md-btn md-btn--primary md-btn--lg" type="button">2명에게 요청 보내기</button><span class="md-caption">한 명과 확정되면 나머지 요청은 자동으로 닫혀요.</span></div>
</div>
</body>
</html>
