<!-- @dsCard group="Forms" height=860 subtitle="강아지 여러 마리, 달력, 시간 휠, 만나는 곳" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>BookingInputs preview</title></head>
<body>
<div style="display:grid;gap:20px;padding:16px;max-width:400px">
  <div class="rb-dogs">
    <button class="rb-dog md-pressable" type="button" aria-pressed="true"><span class="rb-dog__ph"><span class="md-thumb" style="width:100%;height:auto;aspect-ratio:1;border-radius:var(--r4)"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.25 16.25h1.5L12 17z" /><path d="M16 14v.5" /><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309" /><path d="M8 14v.5" /><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5" /></svg></span><span class="rb-dog__tick"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span></span><b>보리</b><small>진돗개 믹스, 21kg</small></button>
    <button class="rb-dog md-pressable" type="button" aria-pressed="true"><span class="rb-dog__ph"><span class="md-thumb" style="width:100%;height:auto;aspect-ratio:1;border-radius:var(--r4)"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.25 16.25h1.5L12 17z" /><path d="M16 14v.5" /><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309" /><path d="M8 14v.5" /><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5" /></svg></span><span class="rb-dog__tick"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span></span><b>콩이</b><small>푸들 믹스, 4kg</small></button>
  </div>
  <p class="rb-hint">두 마리를 같이 맡기면 한 마리 몫의 절반만 더 내요</p>
  <div class="rb-cal">
    <div class="rb-cal__head"><b class="md-num">2026년 11월</b><span class="md-detail">모두 6번 걸어요</span></div>
    <div class="md-cal" aria-hidden="true"><span class="md-cal__dow">일</span><span class="md-cal__dow">월</span><span class="md-cal__dow">화</span><span class="md-cal__dow">수</span><span class="md-cal__dow">목</span><span class="md-cal__dow">금</span><span class="md-cal__dow">토</span></div>
    <div class="md-cal">
      <button class="md-cal__cell" type="button" style="background:linear-gradient(to right, transparent 50%, var(--bg-brand-weak) 50%) center / 100% 36px no-repeat"><span class="md-cal__num" style="background:var(--bg-brand-solid);color:var(--fg-on-brand-solid);font-weight:700">8</span></button>
      <button class="md-cal__cell" type="button" style="background:linear-gradient(var(--bg-brand-weak),var(--bg-brand-weak)) center / 100% 36px no-repeat"><span class="md-cal__num" style="color:var(--fg-brand);font-weight:700">9</span><span class="md-cal__dot"></span></button>
      <button class="md-cal__cell" type="button" style="background:linear-gradient(var(--bg-brand-weak),var(--bg-brand-weak)) center / 100% 36px no-repeat"><span class="md-cal__num">10</span></button>
      <button class="md-cal__cell" type="button" style="background:linear-gradient(var(--bg-brand-weak),var(--bg-brand-weak)) center / 100% 36px no-repeat"><span class="md-cal__num">11</span></button>
      <button class="md-cal__cell" type="button" style="background:linear-gradient(var(--bg-brand-weak),var(--bg-brand-weak)) center / 100% 36px no-repeat"><span class="md-cal__num" style="color:var(--fg-brand);font-weight:700">12</span><span class="md-cal__dot"></span></button>
      <button class="md-cal__cell" type="button" style="background:linear-gradient(var(--bg-brand-weak),var(--bg-brand-weak)) center / 100% 36px no-repeat"><span class="md-cal__num">13</span></button>
      <button class="md-cal__cell" type="button" style="background:linear-gradient(to left, transparent 50%, var(--bg-brand-weak) 50%) center / 100% 36px no-repeat"><span class="md-cal__num" style="background:var(--bg-brand-solid);color:var(--fg-on-brand-solid);font-weight:700">14</span></button>
    </div>
  </div>
  <div class="rb-wheels" style="height:132px" role="group" aria-label="시작 시간"><span class="rb-wheels__band" style="top:44px"></span>
    <div class="rb-wheel" style="height:132px;padding:44px 0;overflow:hidden"><button class="rb-wheel__item" type="button" aria-selected="false" style="margin-top:-44px">오전</button><button class="rb-wheel__item" type="button" aria-selected="true">오후</button></div>
    <div class="rb-wheel" style="height:132px;padding:0;overflow:hidden"><button class="rb-wheel__item" type="button">11</button><button class="rb-wheel__item" type="button" aria-selected="true">12</button><button class="rb-wheel__item" type="button">1</button></div>
    <div class="rb-wheel" style="height:132px;padding:0;overflow:hidden"><button class="rb-wheel__item" type="button">00</button><button class="rb-wheel__item" type="button" aria-selected="true">30</button><span></span></div>
  </div>
  <div class="rb-perday"><button class="rb-perday__row" type="button" aria-checked="false"><span>11월 9일 (월)</span><b class="md-num">오후 12:30</b></button><button class="rb-perday__row" type="button" aria-checked="true"><span>11월 10일 (화)</span><b class="md-num">오전 7:30</b></button></div>
  <div class="rb-addrs">
    <div class="rb-addr" data-on="true"><button class="rb-addr__pick" type="button" role="radio" aria-checked="true"><span class="rb-addr__dot"></span><span class="rb-addr__text"><b>집</b><span>서울 강남구 역삼로 123, 101동 1203호</span><small>공동현관 비밀번호로 들어와요</small></span></button><button class="md-btn md-btn--small rb-addr__edit" type="button">수정</button></div>
    <div class="rb-addr" data-on="false"><button class="rb-addr__pick" type="button" role="radio" aria-checked="false"><span class="rb-addr__dot"></span><span class="rb-addr__text"><b>부모님 댁</b><span>서울 서초구 반포대로 45, 3동 502호</span><small>502호 호출해요</small></span></button><button class="md-btn md-btn--small rb-addr__edit" type="button">수정</button></div>
  </div>
  <div class="md-field rb-pickup"><label class="md-field__label" for="pk">집 픽업 안내</label><textarea class="md-input" id="pk">출근하는 시간이라 비밀번호로 들어오시면 돼요. 목줄은 현관 앞에 있어요.</textarea><div class="md-field__foot"><span>예약이 확정된 시터에게만 보여요</span><span class="md-num">38/300</span></div></div>
  <button class="md-btn md-btn--brand md-btn--large" type="button">집에서 만나기</button>
</div>
</body>
</html>
