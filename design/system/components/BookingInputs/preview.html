<!-- @dsCard group="Forms" height=640 subtitle="한 번/반복, 날짜, 주소, 픽업 안내, 반복 기간 달력" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>BookingInputs preview</title></head>
<body>
<div style="display:grid;gap:16px;padding:16px;max-width:400px">
  <section style="display:grid;gap:8px">
    <span class="md-field__label">날짜</span>
    <div class="md-seg" role="group" aria-label="산책 횟수"><button type="button" aria-pressed="false">한 번</button><button type="button" aria-pressed="true">반복</button></div>
    <button class="md-inputbtn md-pressable" type="button"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg><span class="md-inputbtn__text"><span>매주 월, 수, 금</span><span class="md-detail">11월 9일부터 30일까지, 모두 10번</span></span><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg></button>
  </section>
  <section style="display:grid;gap:8px">
    <span class="md-field__label">주소</span>
    <button class="md-inputbtn md-pressable" type="button"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></svg><span class="md-inputbtn__text"><span style="font-weight:700">집</span><span class="md-detail">서울 강남구 역삼로 123, 101동 1203호</span><span class="md-detail">공동현관 비밀번호로 들어와요</span></span><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg></button>
  </section>
  <div class="md-field">
    <label class="md-field__label" for="pk">픽업 안내<em>선택</em></label>
    <textarea class="md-input" id="pk">제가 출근하는 시간이라 비밀번호로 들어오시면 돼요. 목줄이랑 용품은 현관 앞에 뒀어요.</textarea>
    <div class="md-row"><button class="md-chip md-chip--outline" type="button" style="height:32px"><span>호출해 주세요</span></button><button class="md-chip md-chip--outline" type="button" style="height:32px"><span>크레이트에 있어요</span></button></div>
  </div>
  <section style="display:grid;gap:6px">
    <span class="md-section-title md-num">2026년 11월</span>
    <div class="md-cal" aria-hidden="true"><span class="md-cal__dow">일</span><span class="md-cal__dow">월</span><span class="md-cal__dow">화</span><span class="md-cal__dow">수</span><span class="md-cal__dow">목</span><span class="md-cal__dow">금</span><span class="md-cal__dow">토</span></div>
    <div class="md-cal">
      <button class="md-cal__cell" type="button" style="background:linear-gradient(to right, transparent 50%, var(--bg-brand-weak) 50%)"><span class="md-cal__num" style="background:var(--bg-brand-solid);color:var(--fg-on-brand-solid);font-weight:700">8</span></button>
      <button class="md-cal__cell" type="button" style="background:var(--bg-brand-weak)"><span class="md-cal__num" style="color:var(--fg-brand);font-weight:700">9</span><span class="md-cal__dot"></span></button>
      <button class="md-cal__cell" type="button" style="background:var(--bg-brand-weak)"><span class="md-cal__num">10</span></button>
      <button class="md-cal__cell" type="button" style="background:var(--bg-brand-weak)"><span class="md-cal__num" style="color:var(--fg-brand);font-weight:700">11</span><span class="md-cal__dot"></span></button>
      <button class="md-cal__cell" type="button" style="background:var(--bg-brand-weak)"><span class="md-cal__num">12</span></button>
      <button class="md-cal__cell" type="button" style="background:var(--bg-brand-weak)"><span class="md-cal__num" style="color:var(--fg-brand);font-weight:700">13</span><span class="md-cal__dot"></span></button>
      <button class="md-cal__cell" type="button" style="background:linear-gradient(to left, transparent 50%, var(--bg-brand-weak) 50%)"><span class="md-cal__num" style="background:var(--bg-brand-solid);color:var(--fg-on-brand-solid);font-weight:700">14</span></button>
    </div>
  </section>
</div>
</body>
</html>
