<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>WalkLog preview</title></head>
<body>
<div class="md-stack" style="max-width:420px">
  <article class="md-card">
    <div class="md-walk__media">
      <div class="md-slot" data-slot="walk-photo"><svg class="md-ico" aria-hidden="true"xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><circle cx="11" cy="4" r="2" /><circle cx="18" cy="8" r="2" /><circle cx="20" cy="16" r="2" /><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" /></svg></div>
      <svg class="md-route" viewBox="0 0 160 120" role="img" aria-label="산책 경로">
        <path class="grid" d="M0 30H160M0 60H160M0 90H160M40 0V120M80 0V120M120 0V120"/>
        <path class="path" d="M24 96 C 30 70, 52 74, 60 58 S 70 26, 96 28 S 132 40, 128 64 S 104 92, 84 86"/>
        <circle class="start" cx="24" cy="96" r="6"/><circle class="end" cx="84" cy="86" r="5"/>
      </svg>
    </div>
    <div class="md-walk__body">
      <div class="md-item__head" style="justify-content:space-between"><h3 class="md-section-title">보리의 점심 산책</h3><span class="md-badge md-badge--brand">산책완료</span></div>
      <dl class="md-stats"><div><dt>산책 시간</dt><dd>32<small>분</small></dd></div><div><dt>거리</dt><dd>1.8<small>km</small></dd></div><div><dt>배변</dt><dd>2<small>회</small></dd></div></dl>
      <span class="md-detail">김하늘 시터가 기록했어요. 공유를 허용하면 소셜에도 올라가요.</span>
    </div>
  </article>
</div>
</body>
</html>
