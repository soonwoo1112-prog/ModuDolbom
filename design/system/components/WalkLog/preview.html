<!-- @dsCard group="Walk" height=420 subtitle="산책이 끝나면 남는 기록" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>WalkLog preview</title></head>
<body>
<div class="md-stack" style="max-width:420px">
  <article class="md-card md-walk">
    <div class="md-walk__media">
      <div class="md-slot" data-slot="walk-photo">산책 사진</div>
      <svg class="md-route" viewBox="0 0 160 120" role="img" aria-label="산책 경로">
        <g class="grid"><path d="M0 30H160M0 60H160M0 90H160M40 0V120M80 0V120M120 0V120"/></g>
        <path class="path" d="M24 96 C 30 70, 52 74, 60 58 S 70 26, 96 28 S 132 40, 128 64 S 104 92, 84 86"/>
        <circle class="start" cx="24" cy="96" r="6"/><circle class="end" cx="84" cy="86" r="5"/>
      </svg>
    </div>
    <div class="md-walk__body">
      <div class="md-sitter__head"><h3 class="md-title-2">보리의 점심 산책</h3><span class="md-chip md-chip--done">산책 완료</span></div>
      <dl class="md-stats"><div><dt>산책 시간</dt><dd>32<small>분</small></dd></div><div><dt>거리</dt><dd>1.8<small>km</small></dd></div><div><dt>배변</dt><dd>2<small>회</small></dd></div></dl>
      <p class="md-caption" style="margin:0">김하늘 시터가 기록했어요. 보호자가 허용하면 소셜에 올라가요.</p>
    </div>
  </article>
</div>
</body>
</html>
