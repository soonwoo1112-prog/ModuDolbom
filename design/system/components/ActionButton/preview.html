<!-- @dsCard group="Actions" height=230 subtitle="Brand, Neutral, Weak, Outline, Ghost / Large CTA" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>ActionButton preview</title></head>
<body>
<div class="md-stack" style="max-width:400px">
  <button class="md-btn md-btn--brand md-btn--large md-pressable" type="button">2명에게 요청 보내기</button>
  <div class="md-row">
    <button class="md-btn md-btn--neutral md-pressable" type="button">대화창 열기</button>
    <button class="md-btn md-pressable" type="button">거절</button>
    <button class="md-btn md-btn--outline md-pressable" type="button"><svg class="md-ico md-ico--sm" aria-hidden="true"xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></svg>경로 보기</button>
    <button class="md-btn md-btn--ghost md-pressable" type="button">조건 바꾸기</button>
  </div>
  <div class="md-row">
    <button class="md-btn md-btn--brand md-pressable" type="button" aria-busy="true"><span class="md-spinner" aria-hidden="true"></span>보내는 중</button>
    <button class="md-btn md-pressable" type="button" disabled>요청 마감</button>
  </div>
</div>
</body>
</html>
