<!-- @dsCard group="Matching" height=520 subtitle="여러 시터를 골라 한 번에 요청하기" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>SitterList preview</title></head>
<body>
<div style="max-width:420px">
  <div class="md-list-header">조건에 맞는 시터 6명</div>
  <div class="md-list">
  <label class="md-item md-item--top md-pressable">
    <span class="md-avatar"><svg class="md-ico" aria-hidden="true"xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg></span>
    <span class="md-item__body">
      <span class="md-item__head"><span class="md-list-title">김하늘</span><span class="md-badge md-badge--brand">같은 아파트</span><span class="md-badge md-badge--outline">전담 시터</span></span>
      <span class="md-item__muted">점심시간에 산책할 수 있어요</span>
      <span class="md-tags md-num"><span><b>30분 15,000원</b></span><span>120m</span></span><span class="md-tags md-num"><span>리뷰 48</span><span>재이용 12명</span><span>답장 10분</span></span>
    </span>
    <input class="md-check" type="checkbox" checked aria-label="김하늘 시터 선택" style="margin-top:12px">
  </label>
  <label class="md-item md-item--top md-pressable">
    <span class="md-avatar"><svg class="md-ico" aria-hidden="true"xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg></span>
    <span class="md-item__body">
      <span class="md-item__head"><span class="md-list-title">이도윤</span><span class="md-badge">새로 온 시터</span></span>
      <span class="md-item__muted">수업 없는 화요일과 목요일에 산책해요</span>
      <span class="md-tags md-num"><span><b>30분 12,000원</b></span><span>450m</span></span><span class="md-tags md-num"><span>리뷰 아직 없음</span><span>답장 25분</span></span>
    </span>
    <input class="md-check" type="checkbox" checked aria-label="이도윤 시터 선택" style="margin-top:12px">
  </label>
  <label class="md-item md-item--top md-pressable">
    <span class="md-avatar"><svg class="md-ico" aria-hidden="true"xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg></span>
    <span class="md-item__body">
      <span class="md-item__head"><span class="md-list-title">박서연</span></span>
      <span class="md-item__muted">대형견 산책 경험이 많아요</span>
      <span class="md-tags md-num"><span><b>30분 18,000원</b></span><span>800m</span></span><span class="md-tags md-num"><span>리뷰 112</span><span>재이용 31명</span><span>답장 5분</span></span>
    </span>
    <input class="md-check" type="checkbox" aria-label="박서연 시터 선택" style="margin-top:12px">
  </label>
  </div>
  <div style="padding:12px 16px 16px;display:grid;gap:8px;box-shadow:inset 0 1px 0 var(--stroke-neutral-subtle)">
    <button class="md-btn md-btn--brand md-btn--large md-pressable" type="button">2명에게 요청 보내기</button>
    <span class="md-detail" style="text-align:center">한 명과 확정되면 나머지 요청은 자동으로 닫혀요</span>
  </div>
</div>
</body>
</html>
