<!-- @dsCard group="Feedback" height=230 subtitle="Callout(보험 안내), Snackbar(되돌리기)" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Feedback preview</title></head>
<body>
<div class="md-stack" style="max-width:420px">
  <div class="md-callout" role="note"><svg class="md-ico" aria-hidden="true"xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg><span><b>앱에서 예약한 산책만 보험으로 보장돼요</b><br>앱 밖에서 약속하면 사고가 나도 도움을 받을 수 없어요.</span></div>
  <div class="md-callout md-callout--warning" role="note"><svg class="md-ico" aria-hidden="true"xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg><span>거주지 인증을 마치면 같은 아파트 시터를 먼저 볼 수 있어요.</span></div>
  <div class="md-snackbar" role="status"><span>요청을 거절했어요</span><button type="button">되돌리기</button></div>
</div>
</body>
</html>
