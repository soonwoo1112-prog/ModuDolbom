<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>권한 요청</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav"><a class="md-iconbtn md-pressable" href="{{back}}" aria-label="닫기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></a><span></span><span style="width: 48px;"></span></header>
<main class="pm" style="flex: 1; overflow-y: auto;">
<span class="pm__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><sc-if value="{{isPin}}" hint-placeholder-val="{{ true }}"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></sc-if><sc-if value="{{isBell}}" hint-placeholder-val="{{ false }}"><path d="M10.268 21a2 2 0 0 0 3.464 0" /><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" /></sc-if><sc-if value="{{isImg}}" hint-placeholder-val="{{ false }}"><rect width="18" height="18" x="3" y="3" rx="2" ry="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></sc-if></svg></span>
<h1 class="pm__title">{{title}}</h1>
<ul class="pm__list"><sc-for list="{{reasons}}" as="r" hint-placeholder-count="3"><li><span class="pm__check"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span><span>{{r.text}}</span></li></sc-for></ul>
<p class="pm__note">{{note}}</p>
</main>
<div class="rd-actions">
<sc-if value="{{notYet}}" hint-placeholder-val="{{ true }}"><button class="md-btn md-btn--brand md-btn--large md-pressable" type="button" onClick="{{allow}}">{{allowLabel}}</button><a class="md-btn md-btn--ghost md-pressable" href="{{back}}" style="min-height: 44px;">나중에 할게요</a></sc-if>
<sc-if value="{{granted}}" hint-placeholder-val="{{ false }}"><p class="pm__ok" role="status"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>허용했어요</p><a class="md-btn md-btn--brand md-btn--large md-pressable" href="{{next}}" style="box-sizing: border-box;">{{nextLabel}}</a></sc-if>
</div>
<sc-if value="{{asking}}" hint-placeholder-val="{{ false }}"><div class="md-overlay pm-os" style="justify-content: center; padding: 40px;"><div class="pm-os__box" role="alertdialog" aria-modal="true" aria-label="휴대폰 권한 창"><b>{{osTitle}}</b><span>{{osBody}}</span><sc-for list="{{osChoices}}" as="c" hint-placeholder-count="2"><button type="button" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["위치","알림","사진"],"default":"위치"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'ask' };
  }
  renderVals() {
    const k = this.props.kind || '위치';
    // Explain first, then open the phone's own permission window (simulated here).
    const K = {
      '위치': { title: '산책 경로를 남기려면 위치가 필요해요', allow: '위치 허용하기', back: 'SitterToday.dc.html', next: 'Walking.dc.html', nextLabel: '산책 시작하기',
        reasons: ['산책 중에 보호자가 지금 어디쯤인지 볼 수 있어요', '산책이 끝나면 걸은 길이 산책 기록에 남아요', '산책 시작부터 끝까지만 기록해요. 그 밖의 시간에는 위치를 쓰지 않아요'],
        note: '다음 창에서 "앱을 사용하는 동안"을 고른 뒤, 이어서 "항상 허용"으로 바꿔 주세요. 화면이 꺼져도 경로가 끊기지 않아요.',
        osTitle: '"모두돌봄"이 위치를 사용하도록 허용할까요?', osBody: '산책 중 위치와 경로를 기록해 보호자에게 보여 줘요.', choices: ['앱을 사용하는 동안 허용', '한 번 허용', '허용 안 함'] },
      '알림': { title: '답장과 산책 소식을 바로 알려 드릴게요', allow: '알림 허용하기', back: 'MainR.dc.html', next: 'MainR.dc.html', nextLabel: '계속하기',
        reasons: ['시터가 대화를 시작하거나 확정하면 알려 드려요', '산책이 시작되고 끝날 때 알려 드려요', '결제와 취소처럼 돈이 오가는 일을 알려 드려요'],
        note: '할인이나 이벤트 같은 광고 알림은 따로 동의를 받아요. 알림 종류는 더보기 > 설정에서 언제든 바꿀 수 있어요.',
        osTitle: '"모두돌봄"에서 알림을 보내고자 합니다', osBody: '알림에는 소리, 배지, 알림 표시가 포함될 수 있어요.', choices: ['허용', '허용 안 함'] },
      '사진': { title: '산책 사진을 보내려면 사진 접근이 필요해요', allow: '사진 접근 허용하기', back: 'Walking.dc.html', next: 'Walking.dc.html', nextLabel: '사진 고르기',
        reasons: ['산책 중에 찍은 사진을 보호자에게 바로 보내요', '강아지와 프로필 사진을 올려요', '고른 사진만 올라가요. 다른 사진은 보지 않아요'],
        note: '다음 창에서 "사진 선택"을 고르면 보낼 사진만 골라서 허용할 수 있어요.',
        osTitle: '"모두돌봄"이 사진에 접근하려고 합니다', osBody: '산책 사진과 프로필 사진을 올릴 때 써요.', choices: ['사진 선택...', '모든 사진에 접근 허용', '허용 안 함'] }
    };
    const c = K[k] || K['위치'];
    const st = this.state.step;
    return {
      isPin: k === '위치', isBell: k === '알림', isImg: k === '사진',
      title: c.title, reasons: c.reasons.map((t) => ({ text: t })), note: c.note,
      allowLabel: c.allow, back: c.back, next: c.next, nextLabel: c.nextLabel,
      notYet: st !== 'granted', granted: st === 'granted', asking: st === 'os',
      allow: () => this.setState({ step: 'os' }),
      osTitle: c.osTitle, osBody: c.osBody,
      osChoices: c.choices.map((label) => ({ label: label, pick: () => this.setState({ step: label.indexOf('안 함') >= 0 ? 'ask' : 'granted' }) }))
    };
  }
}
</script>
</body>
</html>
