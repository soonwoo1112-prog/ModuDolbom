<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { liked: {} };
  }
  renderVals() {
    return Object.assign(this.feedVals(), {
      fabCompact: !!this.state.compact,
      onFeedScroll: (e) => { const c = e.currentTarget.scrollTop > 8; if (c !== !!this.state.compact) this.setState({ compact: c }); }
    });
  }
  feedVals() {
    const liked = this.state.liked;
    const base = { a: [12, 3], b: [8, 1], c: [21, 4] };
    const out = {};
    for (const k of Object.keys(base)) {
      const on = !!liked[k];
      out[k] = { liked: on, likes: base[k][0] + (on ? 1 : 0), comments: base[k][1], heartFill: on ? 'currentColor' : 'none',
        like: () => this.setState({ liked: Object.assign({}, liked, { [k]: !on }) }) };
    }
    return out;
  }
}
</script>
