<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보호자 캘린더</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:oklch(46% 0.12 152)}a:hover{color:oklch(44% 0.115 152)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav md-topnav--root">
<h1 class="md-topnav__title">캘린더</h1>
<span></span>
</header>
<div class="cl-dow" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<main style="flex: 1; overflow-y: auto;" data-start-month="11">
<sc-for list="{{months}}" as="m" hint-placeholder-count="3">
<section class="cl-month" aria-label="{{m.title}}">
<h2 class="cl-month__title">{{m.title}}</h2>
<div class="cl-grid" role="grid">
<sc-for list="{{m.cells}}" as="c" hint-placeholder-count="35">
<button class="cl-day md-pressable" type="button" onClick="{{c.pick}}" aria-label="{{c.aria}}" aria-pressed="{{c.selected}}" data-today="{{c.today}}" data-sun="{{c.sun}}" style="{{c.hide}}"><span class="cl-num">{{c.day}}</span><sc-if value="{{c.booked}}" hint-placeholder-val="{{ false }}"><span class="cl-dot" data-past="{{c.past}}"></span></sc-if></button>
</sc-for>
</div>
</section>
</sc-for>
<div class="cl-legend"><span><span class="cl-dot"></span>예약한 산책</span><span><span class="cl-dot" data-past="true"></span>지난 산책</span></div>
</main>
<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div class="md-overlay" onClick="{{close}}">
<div class="md-sheet" role="dialog" aria-modal="true" aria-label="{{selectedTitle}} 산책" onClick="{{stop}}" style="padding-bottom: 24px;">
<span class="md-sheet__handle" aria-hidden="true"></span>
<div class="md-sheet__head"><span></span><h2>{{selectedTitle}}</h2><button class="md-iconbtn md-pressable" type="button" aria-label="닫기" onClick="{{close}}"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></div>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{items}}" as="it" hint-placeholder-count="1">
<a class="md-item md-pressable" href="{{it.href}}" style="margin: 0 -16px;">
<img class="md-photo" src="img/bori.jpg" alt="보리 사진" style="width: 56px; height: 56px; border-radius: var(--r3);">
<span class="md-item__body"><span class="md-item__head"><span class="md-list-title">{{it.title}}</span><span class="{{it.badgeClass}}">{{it.status}}</span></span><span class="md-item__muted">{{it.detail}}</span></span>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="md-ico md-ico--md" style="color: var(--fg-neutral-subtle);"><path d="m9 18 6-6-6-6" /></svg>
</a>
</sc-for>
</sc-if>
<sc-if value="{{noItems}}" hint-placeholder-val="{{ false }}">
<p class="md-detail" style="margin: 0; text-align: center;">이 날은 예약된 산책이 없어요.</p>
<a class="md-btn md-btn--brand md-btn--large md-pressable" href="Main.dc.html" style="box-sizing: border-box;">이 날 산책 부탁하기</a>
</sc-if>
</div>
</div>
</sc-if>
<nav class="md-bottomnav" aria-label="보호자 메뉴">
<a class="md-tab md-pressable" href="Main.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2" /><circle cx="18" cy="8" r="2" /><circle cx="20" cy="16" r="2" /><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" /></svg>예약</a>
<a class="md-tab md-pressable" href="Sent.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>채팅</a>
<a class="md-tab md-pressable" href="SocialFeed.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg>소셜</a>
<a class="md-tab md-pressable" href="GuardianCalendar.dc.html" aria-current="page" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg>캘린더</a>
<button class="md-tab md-pressable" type="button"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16" /><path d="M4 12h16" /><path d="M4 19h16" /></svg>더보기</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"initialSheet":{"editor":"enum","options":["none","open"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: '11-7', open: props.initialSheet === 'open' };
  }
  renderVals() {
    const today = '11-6';
    const sel = this.state.sel;
    const bookings = {
      '10-27': [{ title: '보리 산책, 오후 12:30', detail: '김하늘 시터, 30분', status: '산책완료', badgeClass: 'md-badge', href: 'GuardianLog.dc.html' }],
      '11-3': [{ title: '보리 산책, 오후 12:30', detail: '김하늘 시터, 30분', status: '산책완료', badgeClass: 'md-badge', href: 'GuardianLog.dc.html' }],
      '11-7': [{ title: '보리 산책, 오후 12:30', detail: '김하늘 시터, 30분, 집', status: '예약확정', badgeClass: 'md-badge md-badge--brand-solid', href: 'Chat.dc.html' }],
      '11-14': [{ title: '보리 산책, 오후 6:00', detail: '시터 2명에게 요청했어요', status: '요청중', badgeClass: 'md-badge md-badge--outline', href: 'Sent.dc.html' }],
      '12-5': [{ title: '보리 산책, 오전 10:00', detail: '시터 3명에게 요청했어요', status: '요청중', badgeClass: 'md-badge md-badge--outline', href: 'Sent.dc.html' }]
    };
    // 2026: Oct 1 is a Thursday, Nov 1 a Sunday, Dec 1 a Tuesday.
    const specs = [[10, 31, 4], [11, 30, 0], [12, 31, 2]];
    const months = specs.map(([mo, len, lead]) => {
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push({ day: '', hide: 'visibility: hidden;', booked: false, selected: false, today: false, sun: false, past: false, aria: '', pick: null });
      for (let d = 1; d <= len; d++) {
        const key = mo + '-' + d;
        const booked = !!bookings[key];
        const past = mo < 11 || (mo === 11 && d < 6);
        cells.push({
          day: d, hide: '', booked: booked, past: past,
          selected: key === sel, today: key === today, sun: (lead + d - 1) % 7 === 0,
          aria: mo + '월 ' + d + '일' + (booked ? ', 산책 있음' : ''),
          pick: () => this.setState({ sel: key, open: true })
        });
      }
      return { title: '2026년 ' + mo + '월', cells: cells };
    });
    const items = bookings[sel] || [];
    const [smo, sd] = sel.split('-');
    return {
      months: months,
      selectedTitle: smo + '월 ' + sd + '일',
      sheetOpen: this.state.open,
      close: () => this.setState({ open: false }),
      stop: (e) => e.stopPropagation(),
      items: items,
      hasItems: items.length > 0,
      noItems: items.length === 0
    };
  }
}
</script>
</body>
</html>
