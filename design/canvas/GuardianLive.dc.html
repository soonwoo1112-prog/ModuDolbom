<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보리 산책중</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden; position: relative;">
<header class="md-topnav">
<a class="md-iconbtn md-pressable" href="Main.dc.html" aria-label="뒤로 가기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a>
<h1 class="md-topnav__title">보리 산책중</h1>
<span style="width: 48px;"></span>
</header>
<div class="{{mapCls}}" style="height: 280px;"><svg viewBox="0 0 390 280" role="img" aria-label="보리가 지금까지 걸은 경로와 지금 위치"><path class="lm-grid" d="M0 70.0H390M0 140.0H390M0 210.0H390M98 0V280M195 0V280M292 0V280" /><path class="lm-route" d="{{routeD}}" /></svg><sc-for list="{{pins}}" as="p" hint-placeholder-count="3"><span class="{{p.cls}}" style="{{p.style}}" aria-hidden="true"><span class="lm-pin__b"><sc-if value="{{p.is_pee}}" hint-placeholder-val="{{ true }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" /></svg></sc-if><sc-if value="{{p.is_poop}}" hint-placeholder-val="{{ false }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20h14a2.5 2.5 0 0 0 0-5H5a2.5 2.5 0 0 0 0 5z" /><path d="M7 15a2.5 2.5 0 0 1 0-5h10a2.5 2.5 0 0 1 0 5" /><path d="M9 10a2 2 0 0 1 1-3.7C10.5 5 11.6 4 13 4a3 3 0 0 1 2 6" /><path d="M10 17.5h.01" /><path d="M14 17.5h.01" /></svg></sc-if><sc-if value="{{p.is_photo}}" hint-placeholder-val="{{ false }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" /><circle cx="12" cy="13" r="3" /></svg></sc-if></span></span></sc-for><sc-if value="{{showDog}}" hint-placeholder-val="{{ true }}"><span class="lm-dog" style="{{dogStyle}}" aria-hidden="true"></span></sc-if><span class="md-badge lm-chip" style="position: absolute; left: 12px; top: 12px; background: var(--bg-layer-default); box-shadow: var(--shadow-floating);"><span class="lm-live" aria-hidden="true"></span>실시간 위치</span></div>
<main style="flex: 1; overflow-y: auto;">
<section style="display: flex; flex-direction: column; gap: 6px; padding: 20px 16px;">
<dl class="wk-figs"><div><dt>산책 시간</dt><dd>{{clock}}</dd></div><div><dt>거리</dt><dd>{{km}}<small>km</small></dd></div></dl>
<p class="wk-sub">30분 예약, 오후 1:00에 끝나요</p>
</section>
<div class="md-item" style="cursor: default; box-shadow: inset 0 1px 0 var(--stroke-neutral-subtle), inset 0 -1px 0 var(--stroke-neutral-subtle);">
<span class="md-initial md-initial--sand" role="img" aria-label="김하늘 사진 자리" style="width: 48px; height: 48px; font-size: 19px; border-radius: var(--full);">김</span>
<span class="md-item__body"><span class="md-item__head"><span class="md-list-title">김하늘 시터</span><span class="md-badge md-badge--brand">같은 아파트</span></span><span class="md-item__muted">보리와 걷고 있어요</span></span>
<a class="md-btn md-btn--small md-pressable" href="Chat.dc.html">채팅</a>
</div>
<section style="display: flex; flex-direction: column; gap: 12px; padding: 20px 16px;">
<h2 class="md-section-title" style="margin: 0;">산책 소식</h2>
<ol class="wk-tl wk-tl--pick" aria-label="산책 소식, 누르면 지도에 위치가 보여요"><sc-for list="{{events}}" as="ev" hint-placeholder-count="4"><li class="{{ev.cls}}"><button class="wk-tl__hit" type="button" aria-pressed="{{ev.on}}" aria-label="{{ev.label}}" onClick="{{ev.pick}}"></button><time>{{ev.time}}</time><span class="wk-tl__node"></span><span class="wk-tl__text"><span><sc-if value="{{ev.is_start}}" hint-placeholder-val="{{ true }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" /><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" /><path d="M16 17h4" /><path d="M4 13h4" /></svg></sc-if><sc-if value="{{ev.is_pee}}" hint-placeholder-val="{{ false }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" /></svg></sc-if><sc-if value="{{ev.is_poop}}" hint-placeholder-val="{{ false }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20h14a2.5 2.5 0 0 0 0-5H5a2.5 2.5 0 0 0 0 5z" /><path d="M7 15a2.5 2.5 0 0 1 0-5h10a2.5 2.5 0 0 1 0 5" /><path d="M9 10a2 2 0 0 1 1-3.7C10.5 5 11.6 4 13 4a3 3 0 0 1 2 6" /><path d="M10 17.5h.01" /><path d="M14 17.5h.01" /></svg></sc-if><sc-if value="{{ev.is_photo}}" hint-placeholder-val="{{ false }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" /><circle cx="12" cy="13" r="3" /></svg></sc-if><sc-if value="{{ev.is_end}}" hint-placeholder-val="{{ false }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528" /></svg></sc-if>{{ev.text}}</span><sc-if value="{{ev.is_photo}}" hint-placeholder-val="{{ false }}"><img class="md-photo" src="img/bori.jpg" alt="산책 중 찍은 사진" style="border-radius: var(--r2); width: 96px; height: 72px;"></sc-if></span></li></sc-for></ol>
<p class="wk-sub" style="margin-top: 4px;">산책이 끝나면 기록이 도착해요</p>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.lmSetup();
    this.state = { sec: 12 * 60 + 6, sel: null };
    this.evs = [
      { id: 3, at: 660, time: '오후 12:41', kind: 'pee', text: '쉬했어요' },
      { id: 2, at: 480, time: '오후 12:38', kind: 'photo', text: '사진이 왔어요' },
      { id: 1, at: 60, time: '오후 12:31', kind: 'start', text: '김하늘 시터와 산책을 시작했어요' }
    ];
    this.tick = setInterval(() => this.setState({ sec: this.state.sec + 1 }), 1000);
  }
  kAt(sec) { return Math.round(Math.min(sec, 1800) / 1800 * this.RK); }
  renderVals() {
    const s = this.state;
    const H = 280;
    const k = this.kAt(s.sec + 60);
    const evs = this.evs.map((e) => Object.assign({ i: this.kAt(e.at) }, e));
    return {
      clock: Math.floor(s.sec / 60) + ':' + String(s.sec % 60).padStart(2, '0'),
      km: (s.sec / 60 * 0.06).toFixed(2),
      mapCls: 'lm' + (s.sel ? ' lm--focus' : ''),
      routeD: this.lmD(k, H),
      pins: this.lmPins(evs, H, k, s.sel),
      showDog: true,
      dogStyle: this.lmAt(this.lmPt(k, H), 32),
      events: this.lmTl(evs, s.sel)
    };
  }

  lmSetup() {
    this.RT = [[70.0,229.6],[73.1,224.2],[76.4,219.0],[80.1,214.1],[84.1,209.3],[88.4,204.8],[92.9,200.6],[97.6,196.6],[102.5,192.7],[107.4,188.9],[112.3,185.2],[117.3,181.5],[122.2,177.7],[127.1,173.8],[131.8,169.8],[136.3,165.6],[140.6,161.1],[144.5,156.3],[148.1,151.3],[151.3,146.0],[154.3,140.6],[157.1,135.0],[159.8,129.4],[162.4,123.8],[165.1,118.2],[167.9,112.7],[171.0,107.4],[174.5,102.2],[178.4,97.4],[182.8,93.0],[187.6,89.2],[192.8,85.9],[198.4,83.1],[204.2,80.9],[210.1,79.0],[216.1,77.7],[222.2,76.6],[228.4,75.8],[234.5,75.3],[240.7,74.9],[246.9,74.8],[253.1,74.8],[259.3,75.1],[265.5,75.7],[271.6,76.7],[277.6,78.0],[283.5,79.9],[289.2,82.4],[294.5,85.5],[299.4,89.4],[303.6,93.9],[307.1,99.0],[309.7,104.6],[311.6,110.5],[312.7,116.5],[313.2,122.7],[313.1,128.9],[312.6,135.1],[311.7,141.2],[310.5,147.3],[308.7,153.2],[306.6,159.0],[304.0,164.6],[300.7,169.9],[297.0,174.8],[292.8,179.4],[288.2,183.5],[283.1,187.2],[277.7,190.2],[272.1,192.8],[266.3,194.9],[260.4,196.6],[254.3,197.8],[248.1,198.6],[242.0,199.1],[235.8,199.3],[229.6,199.1],[223.4,198.7],[217.2,198.0],[211.1,197.1],[205.0,196.0]];
    this.RK = this.RT.length - 1;
    this.rm = typeof window !== 'undefined' && window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
  }
  lmPt(i, h) { const p = this.RT[Math.max(0, Math.min(this.RK, Math.round(i)))]; return [p[0], p[1] * h / 280]; }
  lmD(k, h) { let d = ''; for (let i = 0; i <= Math.min(k, this.RK); i++) { const p = this.lmPt(i, h); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); } return d; }
  lmAt(p, size) { const r = size / 2; return 'transform: translate(' + (p[0] - r).toFixed(1) + 'px, ' + (p[1] - r).toFixed(1) + 'px);'; }
  lmKinds(e) { return { is_start: e.kind === 'start', is_pee: e.kind === 'pee', is_poop: e.kind === 'poop', is_photo: e.kind === 'photo', is_end: e.kind === 'end' }; }
  lmPins(evs, h, k, sel) {
    return evs.slice().reverse().filter((e) => e.i <= k).map((e) => {
      const dot = e.kind === 'start' || e.kind === 'end';
      const p = this.lmPt(e.i, h);
      const style = dot ? this.lmAt(p, 14) : 'transform: translate(' + (p[0] - 13).toFixed(1) + 'px, ' + (p[1] - 32).toFixed(1) + 'px);';
      return Object.assign({ cls: 'lm-pin lm-pin--' + e.kind + (sel === e.id ? ' lm-pin--on' : ''), style: style }, this.lmKinds(e));
    });
  }
  lmTl(evs, sel, fresh) {
    return evs.map((e) => Object.assign({ time: e.time, text: e.text, on: sel === e.id, cls: (sel === e.id ? 'is-on' : '') + (fresh === e.id ? ' wk-new' + (e.id % 2 ? 'a' : 'b') : ''), label: e.time + ' ' + e.text + (sel === e.id ? ', 지도에서 보는 중' : ', 지도에서 보기'),
      pick: () => this.setState({ sel: this.state.sel === e.id ? null : e.id }) }, this.lmKinds(e)));
  }
}
</script>
</body>
</html>
