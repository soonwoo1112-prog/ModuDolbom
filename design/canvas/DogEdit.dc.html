<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>강아지 프로필 수정</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav">
<a class="md-iconbtn md-pressable" href="DogProfile.dc.html" aria-label="뒤로 가기"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="md-ico"><path d="m15 18-6-6 6-6" /></svg></a>
<h1 class="md-topnav__title">강아지 프로필 수정</h1>
<span style="width: 48px;"></span>
</header>
<main style="flex: 1; overflow-y: auto;">
<section style="display: flex; flex-direction: column; gap: 12px; padding: 20px 16px;"><div style="display: flex; flex-direction: column; gap: 2px;"><h2 class="md-section-title" style="margin: 0;">꾸미기</h2><p class="wk-sub">프로필 맨 위에 보여요</p></div>
<div class="de-cover" style="background: var(--bg-neutral-weak);"><img src="{{coverSrc}}" alt="배경 사진" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 70%;"><img class="de-cover__photo" src="img/bori.jpg" alt="보리 프로필 사진"></div>
<div class="md-field"><span class="md-field__label">배경 사진<em>보리 사진 중에서 고르거나 새로 올려요</em></span>
<div class="cp-photos"><button class="wk-photos__add md-pressable" type="button" style="width: 72px; height: 72px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6" /><path d="M19 2v6" /><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /><circle cx="9" cy="9" r="2" /></svg>올리기</button><sc-for list="{{covers}}" as="c" hint-placeholder-count="3"><button class="md-pressable" type="button" aria-pressed="{{c.on}}" aria-label="{{c.label}}" onClick="{{c.pick}}" style="flex: none; width: 72px; height: 72px; padding: 0; border: 0; border-radius: var(--r3); overflow: hidden; box-shadow: {{c.ring}};"><img src="{{c.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover;"></button></sc-for></div></div>
<div class="md-row"><button class="md-btn md-btn--small md-pressable" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="md-ico md-ico--md"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" /><circle cx="12" cy="13" r="3" /></svg>프로필 사진 바꾸기</button></div>
</section>
<div class="md-band"></div>
<section style="display: flex; flex-direction: column; gap: 12px; padding: 20px 16px;"><div style="display: flex; flex-direction: column; gap: 2px;"><h2 class="md-section-title" style="margin: 0;">기본 정보</h2></div>
<div class="md-field"><label class="md-field__label" for="dn">이름</label><input class="md-input" id="dn" value="보리"></div>
<div class="md-field"><label class="md-field__label" for="db">견종</label><input class="md-input" id="db" value="진돗개 믹스"></div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px;">
<div class="md-field"><label class="md-field__label" for="dd">생일</label><input class="md-input" id="dd" value="2023년 5월"></div>
<div class="md-field"><label class="md-field__label" for="dw">몸무게</label><input class="md-input" id="dw" value="21kg"></div>
</div>
<div class="md-field"><span class="md-field__label">성별</span><div class="md-seg" role="group" aria-label="성별"><sc-for list="{{sexes}}" as="x" hint-placeholder-count="2"><button type="button" aria-pressed="{{x.on}}" onClick="{{x.pick}}">{{x.label}}</button></sc-for></div></div>
<label class="st-row md-pressable" style="min-height: 48px; padding: 4px 0;"><span>중성화 했어요</span><input class="md-switch" type="checkbox" checked="{{neutered}}" onChange="{{t_neutered}}" aria-label="중성화 했어요"></label>
</section>
<div class="md-band"></div>
<section style="display: flex; flex-direction: column; gap: 12px; padding: 20px 16px;"><div style="display: flex; flex-direction: column; gap: 2px;"><h2 class="md-section-title" style="margin: 0;">성격</h2><p class="wk-sub">시터가 처음 만나기 전에 읽어요. 여러 개를 고를 수 있어요</p></div>
<div class="md-row"><sc-for list="{{traits}}" as="k" hint-placeholder-count="8"><button class="md-chip md-pressable" type="button" aria-pressed="{{k.on}}" onClick="{{k.toggle}}"><span>{{k.label}}</span></button></sc-for></div>
<div class="md-field"><label class="md-field__label" for="dnote">산책할 때 알아 두세요</label><textarea class="md-input" id="dnote">길에 떨어진 음식을 주워 먹으려고 해요. 큰 오토바이 소리에 놀라요.</textarea></div>
</section>
<div class="md-band"></div>
<section style="display: flex; flex-direction: column; gap: 12px; padding: 20px 16px;"><div style="display: flex; flex-direction: column; gap: 2px;"><h2 class="md-section-title" style="margin: 0;">건강</h2></div>
<div class="md-field"><label class="md-field__label" for="dv">예방접종</label><input class="md-input" id="dv" value="종합백신, 광견병 접종 완료"></div>
<div class="md-field"><label class="md-field__label" for="da">알레르기</label><input class="md-input" id="da" value="닭고기"></div>
<div class="md-field"><label class="md-field__label" for="dh">다니는 동물병원</label><input class="md-input" id="dh" value="역삼 24시 동물병원"></div>
</section>
</main>
<div style="padding: 12px 16px 16px; box-shadow: inset 0 1px 0 var(--stroke-neutral-subtle);"><a class="md-btn md-btn--brand md-btn--large md-pressable" href="DogProfile.dc.html" style="box-sizing: border-box;">저장하기</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cover: 0, sex: '수컷', neutered: true,
      traits: { '사람을 좋아해요': true, '다른 강아지를 보면 짖어요': true, '줄을 조금 당겨요': true, '겁이 많아요': false, '공놀이를 좋아해요': false, '간식에 약해요': true, '천천히 걸어요': false, '물을 좋아해요': false } };
  }
  renderVals() {
    const s = this.state;
    const pics = [['img/bori.jpg', '공원에서 찍은 보리'], ['img/gureum.jpg', '꽃길 산책 사진'], ['img/kong.jpg', '콩이와 함께']];
    return {
      coverSrc: pics[s.cover][0],
      covers: pics.map((p, i) => ({ src: p[0], label: p[1], on: s.cover === i, ring: s.cover === i ? '0 0 0 2px var(--bg-layer-default), 0 0 0 4px var(--stroke-neutral-contrast)' : 'none', pick: () => this.setState({ cover: i }) })),
      sexes: ['수컷', '암컷'].map((k) => ({ label: k, on: s.sex === k, pick: () => this.setState({ sex: k }) })),
      neutered: s.neutered, t_neutered: () => this.setState({ neutered: !s.neutered }),
      traits: Object.keys(s.traits).map((k) => ({ label: k, on: s.traits[k], toggle: () => this.setState({ traits: Object.assign({}, s.traits, { [k]: !s.traits[k] }) }) }))
    };
  }
}
</script>
</body>
</html>
