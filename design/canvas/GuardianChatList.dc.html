<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>채팅</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav md-topnav--root">
<h1 class="md-topnav__title">채팅</h1>
<span></span>
</header>
<main style="flex: 1; overflow-y: auto;">
<p class="cl-intro">예약마다 그 예약으로 열린 대화를 모았어요. 가까운 날짜부터 보여요.</p>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section class="cl-group" aria-label="{{g.aria}}">
<a class="cl-booking md-pressable" href="{{g.href}}">
<span class="cl-booking__ph"><sc-for list="{{g.photos}}" as="p" hint-placeholder-count="1"><img class="md-photo" src="{{p.src}}" alt=""></sc-for></span>
<span class="cl-booking__text"><b class="md-num">{{g.title}}</b><span class="md-num">{{g.when}}</span><small class="md-num">{{g.detail}}</small></span>
<span class="{{g.badgeCls}}">{{g.status}}</span>
</a>
<sc-for list="{{g.chats}}" as="r" hint-placeholder-count="2">
<a class="md-item md-pressable cl-chat" href="{{r.href}}" data-closed="{{r.closed}}">
<span class="md-initial md-initial--{{r.tint}}" role="img" aria-label="{{r.name}} 사진 자리" style="width: 48px; height: 48px; font-size: 1.1875rem; border-radius: var(--full);">{{r.first}}</span>
<span class="md-item__body"><span class="md-item__head"><span class="md-list-title">{{r.name}}</span><span class="{{r.cls}}">{{r.state}}</span></span><span class="md-item__muted" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.last}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;"><span class="md-tagtext">{{r.when}}</span><sc-if value="{{r.unread}}" hint-placeholder-val="{{ false }}"><span class="md-nbadge">{{r.unread}}</span></sc-if></span>
</a>
</sc-for>
</section>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><section class="md-result"><p>아직 대화가 없어요. 산책을 요청하면 시터와 여기서 이야기해요.</p></section></sc-if>
</main>
<nav class="md-bottomnav" aria-label="보호자 메뉴">
<a class="md-tab md-pressable" href="MainR.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2" /><circle cx="18" cy="8" r="2" /><circle cx="20" cy="16" r="2" /><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" /></svg>예약</a>
<a class="md-tab md-pressable" href="GuardianChatList.dc.html" aria-current="page" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>채팅</a>
<a class="md-tab md-pressable" href="SocialFeed.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg>소셜</a>
<a class="md-tab md-pressable" href="GuardianCalendar.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg>캘린더</a>
<a class="md-tab md-pressable" href="GuardianMore.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16" /><path d="M4 12h16" /><path d="M4 19h16" /></svg>더보기</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"empty":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tint = (name) => ['sand', 'sky', 'moss', 'peach'][[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % 4];
    const chat = (name, state, cls, last, when, unread, href, closed) => ({ name: name, first: name[0], tint: tint(name), state: state, cls: cls, last: last, when: when, unread: unread, href: href, closed: !!closed });
    const photo = (dogs) => dogs.map((d) => ({ src: d === '콩이' ? 'img/kong.jpg' : 'img/bori.jpg' }));
    // Sample bookings, nearest first. A request sent from the sitter list in this preview replaces the pending sample.
    const confirmed = { key: 7, dogs: ['보리'], title: '보리 산책', when: '오늘, 11월 7일 (토) 오후 12:30', detail: '30분, 집에서 만나요', status: '확정', badgeCls: 'md-badge md-badge--brand', href: 'ChatInfo.dc.html',
      chats: [chat('김하늘', '확정한 시터', 'md-badge md-badge--brand', '확정해 주시면 픽업 안내대로 들어갈게요.', '오후 3:05', 1, 'Chat.dc.html'),
              chat('이도윤', '요청 닫힘', 'md-badge', '김하늘 시터와 확정해서 이 요청은 닫혔어요', '오후 3:10', 0, 'Chat.dc.html', true)] };
    let pending = { key: 9, dogs: ['보리', '콩이'], title: '보리, 콩이 산책', when: '11월 9일, 10일, 11일, 3번, 오후 12:30', detail: '60분, 집에서 만나요', status: '답장 기다리는 중', badgeCls: 'md-badge md-badge--info', href: 'Sent.dc.html',
      chats: [chat('박서연', '대화 중', 'md-badge md-badge--info', '세 날 모두 괜찮아요. 두 마리 같이 걸을게요.', '오후 4:20', 2, 'Chat.dc.html'),
              chat('정민준', '답장 기다리는 중', 'md-badge md-badge--outline', '보리, 콩이 산책 요청을 보냈어요', '오후 4:02', 0, 'Chat.dc.html')] };
    let rq = null;
    try { rq = JSON.parse(sessionStorage.getItem('md-request') || 'null'); } catch (e) { rq = null; }
    if (rq && rq.sitters && rq.sitters.length) {
      pending = { key: 9, dogs: rq.dogs, title: rq.dogs.join(', ') + ' 산책', when: rq.date + ', ' + rq.time, detail: (rq.len || '') + ', 방금 요청했어요', status: '답장 기다리는 중', badgeCls: 'md-badge md-badge--info', href: 'Sent.dc.html',
        chats: rq.sitters.map((n) => chat(n, '답장 기다리는 중', 'md-badge md-badge--outline', rq.dogs.join(', ') + ' 산책 요청을 보냈어요', '방금', 0, 'Chat.dc.html')) };
    }
    const groups = this.props.empty ? [] : [confirmed, pending].sort((a, b) => a.key - b.key).map((g) => Object.assign({}, g, { photos: photo(g.dogs), aria: g.title + ', ' + g.when + ', ' + g.status }));
    return { groups: groups, empty: groups.length === 0 };
  }
}
</script>
</body>
</html>
