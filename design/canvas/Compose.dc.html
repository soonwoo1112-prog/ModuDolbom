<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>직접 쓰기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav">
<a class="md-iconbtn md-pressable" href="ComposePick.dc.html" aria-label="뒤로 가기"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="md-ico"><path d="m15 18-6-6 6-6" /></svg></a>
<h1 class="md-topnav__title">직접 쓰기</h1>
<a class="md-btn md-btn--brand md-btn--small md-pressable" href="SocialFeed.dc.html" style="margin-right: 8px; min-height: 32px; padding: 0 14px;">올리기</a>
</header>
<main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 16px 16px 24px;">
<div class="md-field"><span class="md-field__label">사진<em>{{count}}/10</em></span>
<div class="cp-photos"><button class="wk-photos__add md-pressable" type="button" onClick="{{add}}" style="width: 88px; height: 88px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6" /><path d="M19 2v6" /><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /><circle cx="9" cy="9" r="2" /></svg>추가</button><sc-for list="{{photos}}" as="p" hint-placeholder-count="2"><span><img src="{{p.src}}" alt="{{p.alt}}"></span></sc-for></div></div>
<div class="md-field"><span class="md-field__label">함께 나온 강아지</span><div class="md-row"><sc-for list="{{dogs}}" as="d" hint-placeholder-count="2"><button class="md-chip md-pressable" type="button" aria-pressed="{{d.on}}" onClick="{{d.toggle}}"><span>{{d.label}}</span></button></sc-for></div></div>
<div class="md-field"><label class="md-field__label" for="post">글</label><textarea class="md-input" id="post" style="min-height: 140px;" placeholder="오늘 산책은 어땠나요?">콩이가 처음으로 다른 강아지와 인사했어요. 산책 다녀오면 늘 기분이 좋아 보여요.</textarea></div>
<p class="wk-sub">산책 기록 없이 올리는 글이에요. 기록이 있는 산책은 앞 화면에서 골라 주세요</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 2, dogs: { 보리: false, 콩이: true }, log: true };
  }
  renderVals() {
    const s = this.state;
    const pool = [['img/kong.jpg', '콩이 사진'], ['img/bori.jpg', '보리 사진'], ['img/gureum.jpg', '산책 사진'], ['img/dubu.jpg', '산책 사진']];
    return {
      count: s.n,
      photos: Array.from({ length: s.n }, (_, i) => ({ src: pool[i % 4][0], alt: pool[i % 4][1] })),
      add: () => this.setState({ n: Math.min(s.n + 1, 10) }),
      dogs: Object.keys(s.dogs).map((k) => ({ label: k, on: s.dogs[k], toggle: () => this.setState({ dogs: Object.assign({}, s.dogs, { [k]: !s.dogs[k] }) }) })),
      log: s.log, t_log: () => this.setState({ log: !s.log })
    };
  }
}
</script>
</body>
</html>
