<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>요청을 보냈어요</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; padding: 24px 0;">
<section class="x-done rd-done" role="status">
<span class="x-done__check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg></span>
<h2 class="md-num">{{count}}명에게 요청을 보냈어요</h2>
<p>{{who}} 시터가 {{dogs}}의 산책 요청을 받았어요</p>
</section>
<ol class="x-next" aria-label="이제 일어나는 일">
<li><b>1</b><span>답장이 오면 바로 알림으로 알려 드려요<small>앱을 닫고 기다려도 괜찮아요</small></span></li>
<li><b>2</b><span>대화에서 조건을 맞추고 한 명과 확정해요<small>나머지 요청은 자동으로 닫혀요</small></span></li>
</ol>
<p class="rd-summary md-num">{{summary}}</p>
</main>
<div class="rd-actions">
<a class="md-btn md-btn--brand md-btn--large md-pressable" href="MainR.dc.html" style="box-sizing: border-box;">홈으로 가기</a>
<a class="md-btn md-btn--ghost md-pressable" href="Sent.dc.html" style="min-height: 44px;">보낸 요청 보기</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    let r = null;
    try { r = JSON.parse(sessionStorage.getItem('md-request') || 'null'); } catch (e) { r = null; }
    // Without a request from the sitter list, show the canvas sample.
    r = Object.assign({ sitters: ['김하늘', '이도윤'], dogs: ['보리'], date: '11월 7일 (토), 오늘', time: '오후 12:30' }, r || {});
    return {
      count: r.sitters.length,
      who: r.sitters.join(', '),
      dogs: r.dogs.join(', '),
      summary: r.dogs.join(', ') + ', ' + r.date + ' ' + r.time
    };
  }
}
</script>
</body>
</html>
