<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>채팅</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav md-topnav--root">
<h1 class="md-topnav__title">채팅</h1>
<span></span>
</header>
<main style="flex: 1; overflow-y: auto;">
<p class="cl-intro">예약마다 그 예약의 대화를 모았어요. 가까운 산책부터 보여요.</p>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section class="cl-group" aria-label="{{g.aria}}">
<sc-if value="{{g.heading}}" hint-placeholder-val="{{ false }}"><div class="md-list-header">{{g.heading}}</div></sc-if>
<a class="cl-booking md-pressable" href="{{g.href}}">
<span class="cl-booking__ph"><img class="md-photo" src="{{g.photo}}" alt=""></span>
<span class="cl-booking__text"><b class="md-num">{{g.title}}</b><span class="md-num">{{g.when}}</span><small class="md-num">{{g.detail}}</small></span>
<span class="{{g.badgeCls}}">{{g.status}}</span>
</a>
<a class="md-item md-pressable cl-chat" href="SitterChat.dc.html" data-closed="{{g.past}}">
<span class="md-initial md-initial--{{g.tint}}" role="img" aria-label="{{g.who}} 사진 자리" style="width: 48px; height: 48px; font-size: 1.1875rem; border-radius: var(--full);">{{g.first}}</span>
<span class="md-item__body"><span class="md-list-title">{{g.who}}</span><span class="md-item__muted" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{g.last}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;"><span class="md-tagtext">{{g.at}}</span><sc-if value="{{g.unread}}" hint-placeholder-val="{{ false }}"><span class="md-nbadge">{{g.unread}}</span></sc-if></span>
</a>
</section>
</sc-for>
</main>
<nav class="md-bottomnav" aria-label="시터 메뉴">
<a class="md-tab md-pressable" href="SitterToday.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>오늘</a>
<a class="md-tab md-pressable" href="SitterChatList.dc.html" aria-current="page" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>채팅</a>
<a class="md-tab md-pressable" href="SocialFeed.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg>소셜</a>
<a class="md-tab md-pressable" href="SitterSchedule.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg>캘린더</a>
<a class="md-tab md-pressable" href="SitterMore.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16" /><path d="M4 12h16" /><path d="M4 19h16" /></svg>더보기</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tint = (name) => ['sand', 'sky', 'moss', 'peach'][[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % 4];
    // Today's walks nearest first (the same walks as the 오늘 tab), then finished ones.
    const B = [
      { dog: '보리', photo: 'img/bori.jpg', when: '오늘 오후 12:30', detail: '30분, 역삼로 123, 15,000원', status: '새 요청', badgeCls: 'md-badge md-badge--info', href: 'SitterRequest.dc.html', who: '보리네 보호자', last: '새 요청이에요. 확정 전에 궁금한 걸 물어보세요', at: '방금', unread: 1 },
      { dog: '콩이', photo: 'img/kong.jpg', when: '오늘 오후 2:00', detail: '30분, 역삼로 123 103동', status: '확정', badgeCls: 'md-badge md-badge--brand', href: 'SitterChat.dc.html', who: '콩이네 보호자', last: '오늘도 잘 부탁드려요.', at: '오전 10:12', unread: 0 },
      { dog: '두부', photo: 'img/dubu.jpg', when: '오늘 오후 6:30', detail: '60분, 역삼로 123 101동', status: '확정', badgeCls: 'md-badge md-badge--brand', href: 'SitterChat.dc.html', who: '두부네 보호자', last: '그늘 많은 길로 부탁드려요!', at: '어제', unread: 2 },
      { dog: '구름', photo: 'img/gureum.jpg', when: '오늘 오전 10:00', detail: '30분, 1.9km, 기록 보냄', status: '끝남', badgeCls: 'md-badge', href: 'SitterChat.dc.html', who: '구름이네 보호자', last: '오늘도 감사했어요. 다음 주에 또 부탁드려요.', at: '오전 10:40', unread: 0, past: true }
    ];
    return { groups: B.map((b, i) => Object.assign({}, b, {
      title: b.dog + ' 산책', first: b.who[0], tint: tint(b.who), past: !!b.past,
      heading: b.past && (i === 0 || !B[i - 1].past) ? '끝난 산책' : '',
      aria: b.dog + ', ' + b.when + ', ' + b.status
    })) };
  }
}
</script>
</body>
</html>
