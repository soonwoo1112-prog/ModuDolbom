<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소셜 산책 피드</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:oklch(46% 0.12 152)}a:hover{color:oklch(44% 0.115 152)}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden; position: relative;">
<header class="md-topnav md-topnav--root">
<h1 class="md-topnav__title">역삼동 소셜</h1>
<button class="md-iconbtn md-pressable" type="button" aria-label="검색"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg></button>
</header>
<nav aria-label="소셜 보기" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 44px; box-shadow: inset 0 -1px 0 var(--stroke-neutral-subtle);">
<a href="SocialFeed.dc.html" aria-current="page" style="display: grid; place-items: center; font: 700 15px/20px var(--font-sans); color: var(--fg-neutral); text-decoration: none; box-shadow: inset 0 -2px 0 var(--fg-neutral);">산책 피드</a>
<a href="Community.dc.html" style="display: grid; place-items: center; font: 500 15px/20px var(--font-sans); color: var(--fg-neutral-subtle); text-decoration: none;">동네 이야기</a>
</nav>
<main style="flex: 1; overflow-y: auto;">
<sc-for list="{{posts}}" as="post" hint-placeholder-count="2">
<article class="fd-post">
<div class="fd-head">
<span class="md-initial md-initial--{{post.tint}}" role="img" aria-label="{{post.author}} 사진 자리" style="width: 40px; height: 40px; font-size: 16px; border-radius: var(--full);">{{post.first}}</span>
<span style="display: flex; flex-direction: column; min-width: 0; flex: 1;"><span class="md-item__head"><span class="md-label">{{post.author}}</span><span class="{{post.roleClass}}">{{post.role}}</span></span><span class="md-tags"><span>{{post.place}}</span><span>{{post.time}}</span></span></span>
</div>
<div class="fd-photo"><img class="md-photo" src="{{post.photo}}" alt="{{post.photoLabel}}" style="position: absolute; inset: 0; width: 100%; height: 100%;"><span class="fd-dog"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2" /><circle cx="18" cy="8" r="2" /><circle cx="20" cy="16" r="2" /><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" /></svg>{{post.dog}}</span></div>
<div class="fd-actions">
<button class="fd-act md-pressable" type="button" aria-pressed="{{post.liked}}" onClick="{{post.like}}" aria-label="좋아요 {{post.likes}}개"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="{{post.heartFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" /></svg>{{post.likes}}</button>
<button class="fd-act md-pressable" type="button" aria-label="댓글 {{post.comments}}개"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>{{post.comments}}</button>
<sc-if value="{{post.isSitter}}" hint-placeholder-val="{{ true }}"><a class="fd-ask md-pressable" href="Matching.dc.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" /><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" /><path d="M16 17h4" /><path d="M4 13h4" /></svg>이 시터에게 부탁하기</a></sc-if>
</div>
<p class="fd-text">{{post.text}}</p>
</article>
</sc-for>
</main>
<a class="md-btn md-btn--brand md-pressable" href="ComposePick.dc.html" style="text-decoration: none; position: absolute; right: 16px; bottom: 72px; border-radius: var(--full); min-height: 48px; padding: 0 18px; box-shadow: var(--shadow-floating);"><svg class="md-ico md-ico--md" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg>글쓰기</a>
<nav class="md-bottomnav" aria-label="보호자 메뉴">
<a class="md-tab md-pressable" href="Main.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2" /><circle cx="18" cy="8" r="2" /><circle cx="20" cy="16" r="2" /><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" /></svg>예약</a>
<a class="md-tab md-pressable" href="Sent.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>채팅</a>
<a class="md-tab md-pressable" href="SocialFeed.dc.html" aria-current="page" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg>소셜</a>
<a class="md-tab md-pressable" href="GuardianCalendar.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg>캘린더</a>
<button class="md-tab md-pressable" type="button"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16" /><path d="M4 12h16" /><path d="M4 19h16" /></svg>더보기</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { liked: {} };
  }
  renderVals() {
    const liked = this.state.liked;
    const posts = [
      { id: 'p1', author: '김하늘', role: '시터', isSitter: true, place: '역삼동', time: '1시간 전', photoLabel: '보리 산책 사진', dog: '보리', photo: 'img/bori.jpg', text: '보리와 점심 산책을 했어요. 공원 산책로에 은행잎이 많이 떨어져 있었어요.', likes: 12, comments: 3 },
      { id: 'p2', author: '콩이네', role: '보호자', isSitter: false, place: '역삼동', time: '3시간 전', photoLabel: '콩이 산책 사진', dog: '콩이', photo: 'img/kong.jpg', text: '콩이가 처음으로 다른 강아지와 인사했어요. 산책 다녀오면 늘 기분이 좋아 보여요.', likes: 8, comments: 1 },
      { id: 'p3', author: '정민준', role: '시터', isSitter: true, place: '역삼동', time: '어제', photoLabel: '구름 산책 사진', dog: '구름', photo: 'img/gureum.jpg', text: '구름이랑 꽃이 많은 골목으로 돌아왔어요. 바람이 불 때마다 귀가 날려서 자꾸 멈춰 섰어요.', likes: 21, comments: 4 }
    ];
    return {
      posts: posts.map((p) => {
        const on = !!liked[p.id];
        return {
          ...p,
          first: p.author[0],
          tint: ['sand', 'sky', 'moss', 'peach'][[...p.author].reduce((a, c) => a + c.charCodeAt(0), 0) % 4],
          roleClass: p.isSitter ? 'md-badge md-badge--brand' : 'md-badge',
          liked: on,
          likes: p.likes + (on ? 1 : 0),
          heartFill: on ? 'currentColor' : 'none',
          like: () => this.setState({ liked: { ...liked, [p.id]: !on } })
        };
      })
    };
  }
}
</script>
</body>
</html>
