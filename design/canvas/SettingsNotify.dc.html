<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>알림 설정</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav"><a class="md-iconbtn md-pressable" href="Settings.dc.html" aria-label="뒤로 가기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a><h1 class="md-topnav__title">알림 설정</h1><span style="width: 48px;"></span></header>
<main style="flex: 1; overflow-y: auto;">
<div class="st-group" style="padding-top: 8px;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><label class="rp-block st-toggle"><span><b>{{r.label}}</b><small>{{r.note}}</small></span><input class="md-switch" type="checkbox" checked="{{r.on}}" disabled="{{r.off}}" onChange="{{r.toggle}}"></label></sc-for>
</div>
<p class="py-foot" style="margin: 8px 16px 0;">{{adNote}}</p>
</main>
<sc-if value="{{warn}}" hint-placeholder-val="{{ false }}">
<div class="md-overlay" style="justify-content: center; padding: 24px;" onClick="{{keep}}">
<div role="alertdialog" aria-modal="true" aria-labelledby="sn-title" onClick="{{stop}}" style="background: var(--bg-layer-floating); border-radius: var(--r4); padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-floating);">
<h2 id="sn-title" class="md-section-title">예약·산책 알림을 끌까요?</h2>
<p style="margin: 0; color: var(--fg-neutral-muted); font-size: 0.9375rem; line-height: 1.3125rem;">시터의 수락, 확정이 풀리기 전 안내, 산책 시작과 끝을 놓칠 수 있어요. 확정 안내를 놓치면 3시간 뒤 예약이 풀려요.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px;">
<button class="md-btn md-pressable" type="button" onClick="{{turnOff}}">끌게요</button>
<button class="md-btn md-btn--brand md-pressable" type="button" onClick="{{keep}}">켜 둘게요</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { msg: true, walk: true, social: true, ad: false, night: false, warn: false, adAt: null };
  }
  renderVals() {
    const s = this.state;
    const t = (k) => () => this.setState({ [k]: !s[k] });
    // Marketing push needs its own consent, and a second one for 9pm to 8am.
    return {
      rows: [
        { label: '메시지', note: '시터와 주고받는 채팅', on: s.msg, off: false, toggle: t('msg') },
        { label: '예약·산책', note: '수락, 확정, 산책 시작과 끝, 산책 기록', on: s.walk, off: false, toggle: () => { if (s.walk) this.setState({ warn: true }); else this.setState({ walk: true }); } },
        { label: '소셜', note: '좋아요와 댓글. 많이 달리면 묶어서 보내요', on: s.social, off: false, toggle: t('social') },
        { label: '혜택·소식 (광고)', note: s.ad ? '11월 12일에 받기로 했어요' : '할인과 이벤트 소식', on: s.ad, off: false, toggle: () => this.setState({ ad: !s.ad, night: s.ad ? false : s.night }) },
        { label: '밤에도 혜택·소식 받기', note: '밤 9시부터 아침 8시까지', on: s.night, off: !s.ad, toggle: t('night') }
      ],
      adNote: '혜택·소식은 따로 동의해야 받아요. 켜고 끈 날짜를 알림으로 알려 드려요.',
      warn: s.warn, keep: () => this.setState({ warn: false }), turnOff: () => this.setState({ warn: false, walk: false }), stop: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
