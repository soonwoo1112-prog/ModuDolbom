<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>예약 홈 (새 UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
<link rel="stylesheet" href="v2.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="v2">
<header class="v2-top">
<button class="v2-place md-pressable" type="button" aria-label="동네 바꾸기, 지금 역삼동"><img src="img/logo/mark.svg" alt="모두돌봄">역삼동<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></button>
<a class="v2-bell md-pressable" href="Notifications.dc.html" aria-label="알림"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg></a>
</header>
<main class="v2-main">
<section class="v2-pick" aria-labelledby="v2-q">
<h1 id="v2-q" class="v2-title">오늘은 누구와<br>산책할까요?</h1>
<div class="v2-dogs" role="group" aria-label="산책할 강아지">
<sc-for list="{{dogs}}" as="g" hint-placeholder-count="2"><button class="v2-dog" type="button" aria-pressed="{{g.on}}" onClick="{{g.pick}}"><img src="{{g.photo}}" alt="" style="object-position: {{g.focus}};"><span class="v2-dog__tick" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span><span class="v2-dog__name"><b>{{g.name}}</b><small>{{g.meta}}</small></span></button></sc-for>
</div>
<sc-if value="{{two}}" hint-placeholder-val="{{ false }}"><p class="v2-hint">두 마리를 같이 맡기면 한 마리 몫의 절반만 더 내요</p></sc-if>
<div class="v2-acts">
<a class="{{goCls}}" href="MainR.dc.html" aria-disabled="{{none}}"><span>{{goLabel}}</span><span class="v2-go__arrow" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></span></a>
<a class="v2-self md-pressable" href="GuardianWalk.dc.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" /><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" /><path d="M16 17h4" /><path d="M4 13h4" /></svg>직접 산책 나가서 기록하기</a>
</div>
</section>
<section class="v2-sec" aria-labelledby="v2-next-t">
<h2 id="v2-next-t" class="v2-label">다음 산책</h2>
<a class="v2-next md-pressable" href="Chat.dc.html"><span class="v2-next__day"><b>14</b><small>금요일</small></span><span class="v2-next__text"><b>오후 12:30, 30분</b><span>김하늘 시터와 보리</span></span><span class="v2-next__state">확정</span></a>
</section>
<section class="v2-sec" aria-labelledby="v2-hood-t">
<h2 id="v2-hood-t" class="v2-label">우리 동네</h2>
<a class="v2-hood md-pressable" href="SocialFeed.dc.html"><span class="v2-hood__faces"><img src="img/gureum.jpg" alt=""><img src="img/dubu.jpg" alt=""><img src="img/kong.jpg" alt=""></span><span class="v2-hood__text"><b>오늘 4마리가 산책했어요</b><span>구름, 두부, 콩이의 산책 보기</span></span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg></a>
</section>
</main>
<nav class="v2-nav" aria-label="보호자 메뉴"><a class="v2-tab md-pressable" href="MainV2.dc.html" aria-current="page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2" /><circle cx="18" cy="8" r="2" /><circle cx="20" cy="16" r="2" /><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" /></svg>예약</a><a class="v2-tab md-pressable" href="GuardianChatList.dc.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>채팅</a><a class="v2-tab md-pressable" href="SocialFeed.dc.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg>소셜</a><a class="v2-tab md-pressable" href="GuardianCalendar.dc.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg>캘린더</a><a class="v2-tab md-pressable" href="GuardianMore.dc.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16" /><path d="M4 12h16" /><path d="M4 19h16" /></svg>더보기</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['보리'] };
  }
  renderVals() {
    const s = this.state;
    // Sample dogs; the same two as the page 1 booking home.
    const DOGS = [
      { name: '보리', meta: '진돗개 믹스, 3살', photo: 'img/bori.jpg', focus: 'center' },
      { name: '콩이', meta: '푸들 믹스, 1살', photo: 'img/kong.jpg', focus: 'center' }
    ];
    const n = s.picked.length;
    const names = DOGS.filter((d) => s.picked.indexOf(d.name) >= 0).map((d) => d.name);
    return {
      dogs: DOGS.map((d) => ({ name: d.name, meta: d.meta, photo: d.photo, focus: d.focus, on: s.picked.indexOf(d.name) >= 0,
        pick: () => this.setState({ picked: s.picked.indexOf(d.name) >= 0 ? s.picked.filter((x) => x !== d.name) : s.picked.concat([d.name]) }) })),
      two: n === 2, none: n === 0,
      goCls: n === 0 ? 'v2-go v2-go--off' : 'v2-go md-pressable',
      goLabel: n === 0 ? '강아지를 골라 주세요' : names.join(', ') + (/[가-힣]$/.test(names[names.length - 1]) && (names[names.length - 1].charCodeAt(names[names.length - 1].length - 1) - 44032) % 28 ? '과' : '와') + ' 산책 예약하기'
    };
  }
}
</script>
</body>
</html>
