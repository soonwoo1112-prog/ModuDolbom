<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프로필 꾸미기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav">
<a class="md-iconbtn md-pressable" href="SitterProfileSelf.dc.html" aria-label="뒤로 가기"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="md-ico"><path d="m15 18-6-6 6-6" /></svg></a>
<h1 class="md-topnav__title">프로필 꾸미기</h1>
<span style="width: 48px;"></span>
</header>
<main style="flex: 1; overflow-y: auto;">
<div class="pf-cover" style="height: 160px;"><img src="img/gureum.jpg" alt="커버 사진" style="object-position: center 68%;"><button class="pf-cover__edit md-pressable" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" /><circle cx="12" cy="13" r="3" /></svg>커버 바꾸기</button></div>
<section class="pf-head" style="padding-bottom: 8px;"><div style="position: relative; width: 88px;"><span class="md-initial md-initial--sand pf-head__photo" role="img" aria-label="김하늘 사진 자리" style="width: 88px; height: 88px; font-size: 2.1875rem; border-radius: var(--full);">김</span></div><span class="md-detail">사진을 누르면 프로필 사진을 바꿔요</span></section>
<div style="display: flex; flex-direction: column; gap: 20px; padding: 12px 16px 24px;">
<div class="md-field"><label class="md-field__label" for="oneline">한 줄 소개</label><input class="md-input" id="oneline" value="점심시간마다 역삼공원을 천천히 걷는 이웃 시터예요"><div class="md-field__foot"><span>시터 고르기 목록과 프로필 맨 위에 보여요</span><span class="md-num">26/40</span></div></div>
<div class="md-field"><label class="md-field__label" for="about">소개</label><textarea class="md-input" id="about" style="min-height: 120px;">강아지를 정말 좋아해서 시터를 시작했어요. 어릴 때부터 진돗개와 함께 자랐고, 지금은 점심시간과 주말에 이웃 강아지들과 걸어요. 산책 중에는 사진과 소식을 자주 보내 드려요.</textarea></div>
<div class="md-field"><span class="md-field__label">케어 경험</span>
<dl class="sp-rows"><dt>시터 경력</dt><dd>2년</dd><dt>반려 경험</dt><dd>12년, 진돗개와 푸들</dd><dt>노견 돌봄</dt><dd>2마리</dd></dl></div>
<div class="md-field"><span class="md-field__label">할 수 있는 케어<em>여러 개</em></span>
<div class="md-row"><sc-for list="{{skills}}" as="k" hint-placeholder-count="6"><button class="md-chip md-pressable" type="button" aria-pressed="{{k.on}}" onClick="{{k.toggle}}"><span>{{k.label}}</span></button></sc-for></div></div>
</div>
</main>
<div style="padding: 12px 16px 16px; box-shadow: inset 0 1px 0 var(--stroke-neutral-subtle);"><a class="md-btn md-btn--brand md-btn--large md-pressable" href="SitterProfileSelf.dc.html" style="box-sizing: border-box;">저장하고 프로필 보기</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { '약 먹이기': true, '노견 돌봄': true, '겁 많은 강아지': true, '줄 당김 교정': true, '사진 자주 보내기': true, '목욕·발 닦기': false, '훈련 복습': false } };
  }
  renderVals() {
    const on = this.state.on;
    return { skills: Object.keys(on).map((k) => ({ label: k, on: on[k], toggle: () => this.setState({ on: Object.assign({}, on, { [k]: !on[k] }) }) })) };
  }
}
</script>
</body>
</html>
