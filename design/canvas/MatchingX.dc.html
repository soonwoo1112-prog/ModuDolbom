<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시터 고르기 (리서치 반영)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav">
<a class="md-iconbtn md-pressable" href="MainX.dc.html" aria-label="뒤로 가기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a>
<span></span>
<a class="md-btn md-btn--ghost md-btn--small md-pressable" href="MainX.dc.html" style="margin-right: 8px;">조건 바꾸기</a>
</header>
<main style="flex: 1; overflow-y: auto;">
<div style="padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 6px;">
<h2 class="md-screen-title" style="margin: 0;">누구에게 요청할까요</h2>
<span class="md-tags" style="font-size: 14px; line-height: 19px; color: var(--fg-neutral-muted);"><span><b>보리</b></span><span>11월 7일 (토) 오후 12:30</span><span>30분</span></span>
</div>
<div role="group" aria-label="역삼동 시터 5명, 눌러서 고르기">
<sc-for list="{{sitters}}" as="item" hint-placeholder-count="5">
<div class="xm-row">
<a class="xm-av md-pressable" href="SitterProfile.dc.html" aria-label="{{item.name}} 프로필 보기"><span class="md-initial md-initial--{{item.tint}}" role="img" aria-label="{{item.name}} 사진 자리" style="width: 56px; height: 56px; font-size: 21px; border-radius: var(--full);">{{item.first}}</span></a>
<button class="x-pick md-pressable" type="button" aria-pressed="{{item.checked}}" onClick="{{item.toggle}}" style="grid-template-columns: minmax(0, 1fr) 24px;">
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
<span class="md-item__head"><span class="md-list-title">{{item.name}}</span><sc-for list="{{item.badges}}" as="b" hint-placeholder-count="1"><span class="{{b.cls}}">{{b.label}}</span></sc-for></span>
<span class="md-item__muted">{{item.bio}}</span>
<span style="display: flex; align-items: baseline; gap: 8px;"><span class="x-pick__price md-num">{{item.price}}</span><span class="md-tags md-num"><span>{{item.distance}}</span><span>{{item.reviews}}</span></span></span>
</span>
<span class="x-pick__tick"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span>
</button>
</div>
</sc-for>
</div>
<p class="md-detail" style="margin: 0; padding: 16px 16px 24px;">새로 온 시터도 목록에 함께 보여요. 프로필은 사진을 누르면 열려요.</p>
</main>
<div style="padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 0 var(--stroke-neutral-subtle); background: var(--bg-layer-default);">
<span class="md-detail" style="text-align: center;">한 명과 확정되면 나머지 요청은 자동으로 닫혀요</span>
<sc-if value="{{hasPick}}" hint-placeholder-val="{{ true }}">
<a class="md-btn md-btn--brand md-btn--large md-pressable" href="SentX.dc.html" style="box-sizing: border-box;"><span class="md-num">{{count}}명에게 요청 보내기</span></a>
</sc-if>
<sc-if value="{{noPick}}" hint-placeholder-val="{{ false }}">
<button class="md-btn md-btn--large" type="button" disabled>시터를 눌러서 골라 주세요</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { haneul: true, doyun: true }, bump: 0 };
  }
  renderVals() {
    const list = [
      { id: 'haneul', name: '김하늘', badges: ['같은 아파트'], bio: '점심시간에 산책할 수 있어요', price: '15,000원', distance: '120m', reviews: '리뷰 48' },
      { id: 'doyun', name: '이도윤', badges: ['새로 온 시터'], bio: '수업 없는 화요일과 목요일에 산책해요', price: '12,000원', distance: '450m', reviews: '리뷰 아직 없음' },
      { id: 'seoyeon', name: '박서연', badges: [], bio: '대형견 산책 경험이 많아요', price: '18,000원', distance: '800m', reviews: '리뷰 112' },
      { id: 'minjun', name: '정민준', badges: ['같은 아파트'], bio: '아침과 점심에 산책할 수 있어요', price: '13,000원', distance: '200m', reviews: '리뷰 9' },
      { id: 'yuna', name: '최유나', badges: [], bio: '천천히 걷는 산책을 좋아해요', price: '14,000원', distance: '600m', reviews: '리뷰 23' }
    ];
    const picked = this.state.picked;
    const sitters = list.map((s) => ({
      ...s,
      badges: s.badges.map((label) => ({ label: label, cls: label === '같은 아파트' ? 'md-badge md-badge--brand' : 'md-badge' })),
      first: s.name[0],
      tint: ['sand', 'sky', 'moss', 'peach'][[...s.name].reduce((a, c) => a + c.charCodeAt(0), 0) % 4],
      checked: !!picked[s.id],
      toggle: () => this.setState({ picked: { ...picked, [s.id]: !picked[s.id] }, bump: this.state.bump + 1 })
    }));
    const count = list.filter((s) => picked[s.id]).length;
    return { sitters: sitters, count: count, hasPick: count > 0, noPick: count === 0 };
  }
}
</script>
</body>
</html>
