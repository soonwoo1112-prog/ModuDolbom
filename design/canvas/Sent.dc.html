<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>요청 현황</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden; position: relative;">
<header class="md-topnav">
<a class="md-iconbtn md-pressable" href="MainR.dc.html" aria-label="뒤로 가기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a>
<h1 class="md-topnav__title">요청 현황</h1>
<span style="width: 48px;"></span>
</header>
<main style="flex: 1; overflow-y: auto;">
<section class="rs-booking" aria-label="요청한 예약">
<span class="cl-booking__ph"><sc-for list="{{photos}}" as="p" hint-placeholder-count="2"><img class="md-photo" src="{{p.src}}" alt=""></sc-for></span>
<span class="cl-booking__text"><b class="md-num">{{title}}</b><span class="md-num">{{when}}</span><small class="md-num">{{detail}}</small></span>
<span class="md-badge md-badge--info">답장 기다리는 중</span>
</section>
<p class="rs-note">주소와 픽업 안내는 예약이 확정된 시터에게만 보여요. 한 명과 확정하면 나머지 요청은 자동으로 닫혀요.</p>
<div class="md-list-header md-num">요청한 시터 {{count}}명</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<a class="md-item md-pressable rs-row" href="Chat.dc.html">
<span class="md-initial md-initial--{{r.tint}}" role="img" aria-label="{{r.name}} 사진 자리" style="width: 48px; height: 48px; font-size: 1.1875rem; border-radius: var(--full);">{{r.first}}</span>
<span class="md-item__body"><span class="md-item__head"><span class="md-list-title">{{r.name}}</span><span class="{{r.cls}}">{{r.state}}</span></span><span class="md-item__muted">{{r.note}}</span></span>
<svg class="rb-chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
</a>
</sc-for>
<div style="padding: 24px 16px 32px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
<a class="md-btn md-btn--outline md-pressable" href="Matching.dc.html" style="width: 100%; box-sizing: border-box;">다른 시터에게도 요청하기</a>
<button class="md-btn md-btn--ghost md-btn--small md-pressable" type="button" onClick="{{ask}}" style="min-height: 44px;">요청 모두 취소하기</button>
</div>
</main>
<sc-if value="{{asking}}" hint-placeholder-val="{{ false }}">
<div class="md-overlay" style="justify-content: center; padding: 24px;" onClick="{{close}}">
<div role="alertdialog" aria-modal="true" aria-labelledby="cancel-title" onClick="{{stop}}" style="background: var(--bg-layer-floating); border-radius: var(--r4); padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-floating);">
<h2 id="cancel-title" class="md-section-title">요청을 모두 취소할까요</h2>
<p class="md-num" style="margin: 0; color: var(--fg-neutral-muted); font-size: 0.9375rem; line-height: 1.3125rem;">{{who}} 시터에게 보낸 요청이 닫혀요. 대화 중인 내용도 더 이어갈 수 없어요.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px;">
<button class="md-btn md-pressable" type="button" onClick="{{close}}">닫기</button>
<a class="md-btn md-btn--critical md-pressable" href="MainR.dc.html" onClick="{{cancelAll}}">요청 취소하기</a>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { asking: false };
  }
  renderVals() {
    const tint = (name) => ['sand', 'sky', 'moss', 'peach'][[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % 4];
    let rq = null;
    try { rq = JSON.parse(sessionStorage.getItem('md-request') || 'null'); } catch (e) { rq = null; }
    // The same pending sample as the home and the chat list; a request sent in this preview replaces it.
    const req = rq && rq.sitters && rq.sitters.length
      ? { dogs: rq.dogs, when: rq.date + ', ' + rq.time, detail: (rq.len || '') + ', 방금 요청했어요', rows: rq.sitters.map((n) => ({ name: n, state: '답장 기다리는 중', cls: 'md-badge md-badge--outline', note: '아직 답장이 없어요. 답장이 오면 알려 드려요' })) }
      : { dogs: ['보리', '콩이'], when: '11월 9일, 10일, 11일, 3번, 오후 12:30', detail: '60분, 집에서 만나요', rows: [
          { name: '박서연', state: '대화 중', cls: 'md-badge md-badge--info', note: '세 날 모두 괜찮다고 답장했어요' },
          { name: '정민준', state: '답장 기다리는 중', cls: 'md-badge md-badge--outline', note: '아직 답장이 없어요. 보통 40분 안에 답장해요' }] };
    return {
      photos: req.dogs.map((d) => ({ src: d === '콩이' ? 'img/kong.jpg' : 'img/bori.jpg' })),
      title: req.dogs.join(', ') + ' 산책', when: req.when, detail: req.detail,
      count: req.rows.length, who: req.rows.map((r) => r.name).join(', '),
      rows: req.rows.map((r) => Object.assign({ first: r.name[0], tint: tint(r.name) }, r)),
      asking: this.state.asking,
      ask: () => this.setState({ asking: true }),
      close: () => this.setState({ asking: false }),
      stop: (e) => e.stopPropagation(),
      cancelAll: () => { try { sessionStorage.removeItem('md-request'); } catch (e) { /* storage off */ } }
    };
  }
}
</script>
</body>
</html>
