<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>정산 계좌</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav"><a class="md-iconbtn md-pressable" href="VerifyHome.dc.html" aria-label="뒤로 가기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a><h1 class="md-topnav__title">정산 계좌</h1><span class="ac-step md-num">1/3</span></header>
<main class="ac-main">
<h2 class="md-screen-title">산책비를 받을 계좌를 알려 주세요</h2>
<p class="ac-sub">본인 인증한 이름과 같은 이름의 계좌만 쓸 수 있어요</p>
<div class="md-field"><span class="md-field__label">은행</span><div class="md-row" role="group" aria-label="은행"><sc-for list="{{banks}}" as="b" hint-placeholder-count="5"><button class="md-chip md-pressable" type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}"><span>{{b.label}}</span></button></sc-for></div></div>
<div class="md-field"><label class="md-field__label" for="acc">계좌번호</label><input class="md-input md-num" id="acc" inputmode="numeric" placeholder="숫자만" value="{{acc}}" onChange="{{typeAcc}}"></div>
<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}"><div class="md-field"><label class="md-field__label" for="code">입금자명의 숫자 4자리</label><input class="md-input md-num" id="code" inputmode="numeric" placeholder="예: 1234" value="{{code}}" onChange="{{typeCode}}" aria-describedby="code-help"><div class="md-field__foot"><span id="code-help">방금 이 계좌로 1원을 보냈어요. 입금자명 "모두1234"의 숫자를 적어 주세요</span></div></div></sc-if>
</main>
<div class="ac-cta">
<sc-if value="{{canSend}}" hint-placeholder-val="{{ true }}"><button class="md-btn md-btn--brand md-btn--large md-pressable" type="button" onClick="{{send}}">1원 보내서 확인하기</button></sc-if>
<sc-if value="{{cantSend}}" hint-placeholder-val="{{ false }}"><button class="md-btn md-btn--large" type="button" disabled style="width: 100%;">은행과 계좌번호를 적어 주세요</button></sc-if>
<sc-if value="{{canNext}}" hint-placeholder-val="{{ false }}"><a class="md-btn md-btn--brand md-btn--large md-pressable" href="SitterQuiz.dc.html" style="box-sizing: border-box;">계좌 확인하고 다음</a></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { bank: '국민', acc: '', sent: false, code: '' };
  }
  renderVals() {
    const s = this.state;
    const ready = !!s.bank && s.acc.replace(/\D/g, '').length >= 10;
    return {
      banks: ['국민', '신한', '우리', '하나', '카카오뱅크', '토스뱅크', '농협'].map((b) => ({ label: b, on: s.bank === b, pick: () => this.setState({ bank: b }) })),
      acc: s.acc, typeAcc: (e) => this.setState({ acc: e.target.value }),
      sent: s.sent, code: s.code, typeCode: (e) => this.setState({ code: e.target.value }),
      canSend: ready && !s.sent, cantSend: !ready && !s.sent,
      send: () => this.setState({ sent: true }),
      canNext: s.sent && s.code.replace(/\D/g, '').length === 4
    };
  }
}
</script>
</body>
</html>
