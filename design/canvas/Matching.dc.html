<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시터 고르기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav">
<a class="md-iconbtn md-pressable" href="MainR.dc.html" aria-label="뒤로 가기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a>
<span></span>
<a class="md-btn md-btn--ghost md-btn--small md-pressable" href="MainR.dc.html" style="margin-right: 8px; min-height: 44px;">조건 바꾸기</a>
</header>
<main style="flex: 1; overflow-y: auto;">
<div class="mt-head">
<h2 class="md-screen-title">누구에게 요청할까요</h2>
<p class="mt-cond md-num"><b>{{dogText}}</b><span>{{when}}</span><span>{{len}}</span></p>
<p class="md-detail">여러 명을 골라 한 번에 요청해요. 사진을 누르면 프로필이 열려요.</p>
</div>
<div role="group" aria-label="역삼동 시터 5명, 눌러서 고르기">
<sc-for list="{{sitters}}" as="item" hint-placeholder-count="5">
<div class="xm-row">
<a class="xm-av md-pressable" href="SitterProfile.dc.html" aria-label="{{item.name}} 프로필 보기"><span class="md-initial md-initial--{{item.tint}}" role="img" aria-label="{{item.name}} 사진 자리" style="width: 56px; height: 56px; font-size: 1.3125rem; border-radius: var(--full);">{{item.first}}</span></a>
<button class="x-pick md-pressable" type="button" aria-pressed="{{item.checked}}" onClick="{{item.toggle}}" style="grid-template-columns: minmax(0, 1fr) 28px;">
<span class="mt-body">
<span class="md-item__head"><span class="md-list-title">{{item.name}}</span><sc-for list="{{item.badges}}" as="b" hint-placeholder-count="1"><span class="{{b.cls}}">{{b.label}}</span></sc-for></span>
<span class="md-item__muted">{{item.bio}}</span>
<span class="mt-price"><b class="md-num">{{item.price}}</b><small class="md-num">{{item.priceNote}}</small></span><sc-if value="{{item.total}}" hint-placeholder-val="{{ false }}"><span class="mt-total md-num">{{item.total}}</span></sc-if>
<span class="mt-stats md-num"><span class="mt-star"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></svg>{{item.reviews}}</span><span>{{item.distance}}</span><span>{{item.reply}}</span></span>
</span>
<span class="x-pick__tick"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span>
</button>
</div>
</sc-for>
</div>
<p class="md-detail" style="margin: 0; padding: 16px 16px 24px;">가격은 시터 프로필의 가격표대로 계산했어요. 주말과 이른 아침은 할증이 더해져요.</p>
</main>
<div style="padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 0 var(--stroke-neutral-subtle); background: var(--bg-layer-default);">
<span class="md-detail" style="text-align: center;">한 명과 확정되면 나머지 요청은 자동으로 닫혀요</span>
<sc-if value="{{hasPick}}" hint-placeholder-val="{{ true }}"><a class="md-btn md-btn--brand md-btn--large md-pressable" href="RequestDone.dc.html" onClick="{{send}}" style="box-sizing: border-box;"><span class="md-num">{{count}}명에게 요청 보내기</span></a></sc-if>
<sc-if value="{{noPick}}" hint-placeholder-val="{{ false }}"><button class="md-btn md-btn--large" type="button" disabled>시터를 눌러서 골라 주세요</button></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { haneul: true, doyun: true } };
    let b = null;
    try { b = JSON.parse(sessionStorage.getItem('md-booking') || 'null'); } catch (e) { b = null; }
    // Without a booking from the previous screen, show the canvas sample.
    this.booking = Object.assign({ dogs: ['보리'], date: '11월 7일 (토), 오늘', time: '오후 12:30', len: '30분' }, b || {});
    if (!this.booking.dogs.length) this.booking.dogs = ['보리'];
    if (!this.booking.time) this.booking.time = '오후 12:30';
    if (!this.booking.len) this.booking.len = '30분';
  }
  renderVals() {
    const list = [
      { id: 'haneul', name: '김하늘', badges: ['같은 아파트'], bio: '점심시간에 산책할 수 있어요', base: 15000, distance: '120m', reviews: '4.9 (48)', reply: '답장 10분' },
      { id: 'doyun', name: '이도윤', badges: ['새로 온 시터'], bio: '수업 없는 화요일과 목요일에 산책해요', base: 12000, distance: '450m', reviews: '후기 아직 없음', reply: '답장 25분' },
      { id: 'seoyeon', name: '박서연', badges: [], bio: '대형견 산책 경험이 많아요', base: 18000, distance: '800m', reviews: '4.8 (112)', reply: '답장 5분' },
      { id: 'minjun', name: '정민준', badges: ['같은 아파트'], bio: '아침과 점심에 산책할 수 있어요', base: 13000, distance: '200m', reviews: '4.7 (9)', reply: '답장 40분' },
      { id: 'yuna', name: '최유나', badges: [], bio: '천천히 걷는 산책을 좋아해요', base: 14000, distance: '600m', reviews: '4.9 (23)', reply: '답장 15분' }
    ];
    const bk = this.booking, n = bk.dogs.length;
    const mult = { '30분': 1, '60분': 1.7 }[bk.len];
    const won = (v) => Math.round(v / 100) * 100;
    const fmt = (v) => won(v).toLocaleString('ko-KR') + '원';
    const picked = this.state.picked;
    const sitters = list.map((s) => {
      const extra = (n - 1) * s.base / 2;
      const price = mult ? fmt(s.base * mult + extra) : fmt(s.base + extra) + '부터';
      const times = Number(bk.count) || 0;
      const each = mult ? s.base * mult + extra : 0;
      const note = !mult ? '90분은 대화에서 정해요' : (n > 1 ? n + '마리, ' : '') + bk.len + (times > 1 ? ', 한 번' : '');
      const total = mult && times > 1 ? times + '번 모두 ' + fmt(each * times) : '';
      return Object.assign({}, s, {
        badges: s.badges.map((label) => ({ label: label, cls: label === '같은 아파트' ? 'md-badge md-badge--brand' : 'md-badge' })),
        first: s.name[0], price: price, priceNote: note, total: total,
        tint: ['sand', 'sky', 'moss', 'peach'][[...s.name].reduce((a, c) => a + c.charCodeAt(0), 0) % 4],
        checked: !!picked[s.id],
        toggle: () => this.setState({ picked: Object.assign({}, picked, { [s.id]: !picked[s.id] }) })
      });
    });
    const chosen = list.filter((s) => picked[s.id]).map((s) => s.name);
    return {
      dogText: bk.dogs.join(', '), when: bk.date + ' ' + bk.time, len: bk.len,
      sitters: sitters, count: chosen.length, hasPick: chosen.length > 0, noPick: chosen.length === 0,
      send: () => { try { sessionStorage.setItem('md-request', JSON.stringify({ sitters: chosen, dogs: bk.dogs, date: bk.date, time: bk.time, len: bk.len })); } catch (e) { /* storage off */ } }
    };
  }
}
</script>
</body>
</html>
