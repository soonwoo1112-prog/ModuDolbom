<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시터 고르기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav">
<a class="md-iconbtn md-pressable" href="Main.dc.html" aria-label="뒤로 가기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a>
<h1 class="md-topnav__title">시터 고르기</h1>
<span style="width: 48px;"></span>
</header>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px 12px; box-shadow: inset 0 -1px 0 var(--stroke-neutral-subtle);">
<div class="md-tags" style="font-size: 14px; line-height: 19px; color: var(--fg-neutral-muted);"><span><b>보리</b></span><span>11월 7일 (토) 오후 12:30</span><span>30분</span></div>
<a class="md-btn md-btn--ghost md-btn--small md-pressable" href="Main.dc.html">조건 바꾸기</a>
</div>
<main style="flex: 1; overflow-y: auto;">
<div style="padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 2px;">
<span class="md-section-title">조건에 맞는 시터 5명</span>
<span class="md-detail">여러 명을 골라 한 번에 요청할 수 있어요</span>
</div>
<div class="md-list">
<sc-for list="{{sitters}}" as="item" hint-placeholder-count="5">
<label class="md-item md-item--top md-pressable">
<span class="md-initial md-initial--{{item.tint}}" role="img" aria-label="{{item.name}} 사진 자리" style="width: 48px; height: 48px; font-size: 19px; border-radius: var(--full);">{{item.first}}</span>
<span class="md-item__body">
<span class="md-item__head"><a class="md-list-title" href="SitterProfile.dc.html" style="color: inherit; text-decoration: underline; text-decoration-color: var(--stroke-neutral-weak); text-underline-offset: 3px;">{{item.name}}</a><sc-for list="{{item.badges}}" as="b" hint-placeholder-count="1"><span class="{{b.cls}}">{{b.label}}</span></sc-for></span>
<span class="md-item__muted">{{item.bio}}</span>
<span class="md-tags md-num"><span><b>{{item.price}}</b></span><span>{{item.distance}}</span></span>
<span class="md-stat-row md-num">
<span class="md-stat"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></svg>{{item.reviews}}</span>
<sc-if value="{{item.repeat}}" hint-placeholder-val="{{ true }}"><span class="md-stat"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4" /><path d="M3 11v-1a4 4 0 0 1 4-4h14" /><path d="m7 22-4-4 4-4" /><path d="M21 13v1a4 4 0 0 1-4 4H3" /></svg>{{item.repeat}}</span></sc-if>
<span class="md-stat"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>{{item.reply}}</span>
</span>
</span>
<input class="md-check" type="checkbox" checked="{{item.checked}}" onChange="{{item.toggle}}" aria-label="{{item.name}} 시터 선택" style="margin-top: 12px;">
</label>
</sc-for>
</div>
</main>
<div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 0 var(--stroke-neutral-subtle); background: var(--bg-layer-default);">
<sc-if value="{{hasPick}}" hint-placeholder-val="{{ true }}">
<a class="md-btn md-btn--brand md-btn--large md-pressable" href="Sent.dc.html" style="box-sizing: border-box;">{{count}}명에게 요청 보내기</a>
</sc-if>
<sc-if value="{{noPick}}" hint-placeholder-val="{{ false }}">
<button class="md-btn md-btn--large" type="button" disabled>시터를 한 명 이상 골라 주세요</button>
</sc-if>
<span class="md-detail" style="text-align: center;">한 명과 확정되면 나머지 요청은 자동으로 닫혀요</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { haneul: true, doyun: true } };
  }
  renderVals() {
    const list = [
      { id: 'haneul', name: '김하늘', badges: ['같은 아파트'], bio: '점심시간에 산책할 수 있어요', price: '30분 15,000원', distance: '120m', reviews: '리뷰 48', repeat: '반복고객 12명', reply: '답장 10분' },
      { id: 'doyun', name: '이도윤', badges: ['새로 온 시터'], bio: '수업 없는 화요일과 목요일에 산책해요', price: '30분 12,000원', distance: '450m', reviews: '리뷰 아직 없음', repeat: '', reply: '답장 25분' },
      { id: 'seoyeon', name: '박서연', badges: [], bio: '대형견 산책 경험이 많아요', price: '30분 18,000원', distance: '800m', reviews: '리뷰 112', repeat: '반복고객 31명', reply: '답장 5분' },
      { id: 'minjun', name: '정민준', badges: ['같은 아파트'], bio: '아침과 점심에 산책할 수 있어요', price: '30분 13,000원', distance: '200m', reviews: '리뷰 9', repeat: '', reply: '답장 40분' },
      { id: 'yuna', name: '최유나', badges: [], bio: '천천히 걷는 산책을 좋아해요', price: '30분 14,000원', distance: '600m', reviews: '리뷰 23', repeat: '반복고객 4명', reply: '답장 15분' }
    ];
    const picked = this.state.picked;
    const sitters = list.map((s) => ({
      ...s,
      badges: s.badges.map((label) => ({ label: label, cls: label === '같은 아파트' ? 'md-badge md-badge--brand' : 'md-badge' })),
      first: s.name[0],
      tint: ['sand', 'sky', 'moss', 'peach'][[...s.name].reduce((a, c) => a + c.charCodeAt(0), 0) % 4],
      checked: !!picked[s.id],
      toggle: () => this.setState({ picked: { ...picked, [s.id]: !picked[s.id] } })
    }));
    const count = list.filter((s) => picked[s.id]).length;
    return { sitters: sitters, count: count, hasPick: count > 0, noPick: count === 0 };
  }
}
</script>
</body>
</html>
