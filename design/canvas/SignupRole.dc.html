<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>어떻게 함께할까요</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav"><a class="md-iconbtn md-pressable" href="Login.dc.html" aria-label="뒤로 가기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a><h1 class="md-topnav__title"></h1><span class="ac-step md-num">1/3</span></header>
<main class="ac-main">
<h2 class="md-screen-title">어떻게 함께할까요?</h2>
<p class="ac-sub">나중에 더보기에서 다른 역할도 시작할 수 있어요</p>
<div class="ac-roles" role="radiogroup" aria-label="역할">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="2"><button class="ac-role md-pressable" type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}"><span class="ac-role__ico"><sc-if value="{{r.g}}" hint-placeholder-val="{{ true }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2" /><circle cx="18" cy="8" r="2" /><circle cx="20" cy="16" r="2" /><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" /></svg></sc-if><sc-if value="{{r.s}}" hint-placeholder-val="{{ false }}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" /><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" /><path d="M16 17h4" /><path d="M4 13h4" /></svg></sc-if></span><span class="ac-role__text"><b>{{r.title}}</b><span>{{r.body}}</span></span><span class="x-pick__tick"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span></button></sc-for>
</div>
</main>
<div class="ac-cta"><sc-if value="{{picked}}" hint-placeholder-val="{{ true }}"><a class="md-btn md-btn--brand md-btn--large md-pressable" href="VerifyPhone.dc.html" onClick="{{save}}" style="box-sizing: border-box;">{{nextLabel}}</a></sc-if><sc-if value="{{notPicked}}" hint-placeholder-val="{{ false }}"><button class="md-btn md-btn--large" type="button" disabled style="width: 100%;">하나를 골라 주세요</button></sc-if></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: null };
  }
  renderVals() {
    const s = this.state;
    const R = [
      { id: 'guardian', g: true, s: false, title: '산책을 맡길래요', body: '바쁜 날, 같은 동네 이웃에게 강아지 산책을 부탁해요' },
      { id: 'sitter', g: false, s: true, title: '산책을 맡아 줄래요', body: '시간 날 때 이웃 강아지를 산책시키고 돈을 받아요' }
    ];
    return {
      roles: R.map((r) => Object.assign({}, r, { on: s.role === r.id, pick: () => this.setState({ role: r.id }) })),
      picked: !!s.role, notPicked: !s.role,
      nextLabel: s.role === 'sitter' ? '시터로 시작하기' : '보호자로 시작하기',
      save: () => { try { sessionStorage.setItem('md-role', s.role); } catch (e) { /* storage off */ } }
    };
  }
}
</script>
</body>
</html>
