<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>예약 (Taste 실험)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:oklch(46% 0.12 152)}a:hover{color:oklch(44% 0.115 152)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav md-topnav--root">
<h1 style="margin: 0;"><button class="md-topnav__location md-pressable" type="button" aria-label="동네 바꾸기, 지금 역삼동">역삼동<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></button></h1>
<a class="md-iconbtn md-pressable" href="Notifications.dc.html" aria-label="알림"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0" /><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" /></svg></a>
</header>
<main style="flex: 1; overflow-y: auto;">
<div class="tt-dogphoto"><img class="md-photo" src="{{dogPhoto}}" alt="{{dog}} 사진" style="object-position: {{dogFocus}};">
<div class="tt-dogpick" role="group" aria-label="산책할 강아지"><sc-for list="{{dogs}}" as="d" hint-placeholder-count="2"><button class="md-pressable" type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}">{{d.name}}</button></sc-for></div></div>
<section class="tt-ask">
<p class="tt-sentence"><button class="tt-tok md-pressable" type="button" onClick="{{nextDog}}" aria-label="강아지 바꾸기, 지금 {{dog}}">{{dog}}</button>{{dogJosa}} <a class="tt-tok md-pressable" href="BookDateOnce.dc.html" aria-label="날짜 바꾸기, 지금 {{dateText}}">{{dateText}}</a> <button class="tt-tok md-pressable" type="button" onClick="{{nextTime}}" aria-label="시작 시간 바꾸기, 지금 {{timeText}}">{{timeText}}</button>부터 <button class="tt-tok md-pressable" type="button" onClick="{{nextLen}}" aria-label="산책 길이 바꾸기, 지금 {{len}}">{{len}}</button> 산책시켜 줄 이웃을 찾아요.</p>
<a class="tt-where md-pressable" href="BookAddress.dc.html"><span><small>만나는 곳</small>집, 역삼로 123 103동 현관</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="md-ico md-ico--sm"><path d="m9 18 6-6-6-6" /></svg></a>
<p class="tt-note">한 번만 맡겨요. <a href="BookDateRepeat.dc.html">매주 반복으로 바꾸기</a></p>
</section>
<section class="tt-match" aria-label="이 조건에 맞는 시터">
<div class="tt-faces" aria-hidden="true"><span class="md-initial md-initial--sand">김</span><span class="md-initial md-initial--sky">이</span><span class="md-initial md-initial--moss">박</span><span class="md-initial md-initial--peach">정</span><span class="md-initial md-initial--sand">최</span></div>
<p>이 조건이면 이웃 시터 {{count}}명이 걸을 수 있어요. 그중 2명은 같은 아파트예요. {{len}} 가격은 시터마다 {{priceRange}}이에요.</p>
</section>
<p class="tt-self"><a href="GuardianWalk.dc.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="md-ico md-ico--sm"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" /><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" /><path d="M16 17h4" /><path d="M4 13h4" /></svg>오늘은 내가 걸어요, 내 산책 기록하기</a></p>
</main>
<div style="padding: 12px 16px; box-shadow: inset 0 1px 0 var(--stroke-neutral-subtle);"><a class="md-btn md-btn--brand md-btn--large md-pressable" href="Matching.dc.html" style="box-sizing: border-box;">시터 {{count}}명 보기</a></div>
<nav class="md-bottomnav" aria-label="보호자 메뉴">
<a class="md-tab md-pressable" href="Main.dc.html" aria-current="page" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2" /><circle cx="18" cy="8" r="2" /><circle cx="20" cy="16" r="2" /><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" /></svg>예약</a>
<a class="md-tab md-pressable" href="Sent.dc.html" style="text-decoration: none;"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>채팅</a>
<button class="md-tab md-pressable" type="button"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg>소셜</button>
<button class="md-tab md-pressable" type="button"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg>캘린더</button>
<button class="md-tab md-pressable" type="button"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16" /><path d="M4 12h16" /><path d="M4 19h16" /></svg>더보기</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dog: 0, time: 1, len: 0 };
    this.D = [{ name: '보리', photo: 'img/bori.jpg', focus: 'center 30%', josa: '를', size: 'mid' }, { name: '콩이', photo: 'img/kong.jpg', focus: 'center 40%', josa: '를', size: 'small' }];
    this.T = ['오전 10:00', '오후 12:30', '오후 6:30'];
    this.L = [{ t: '30분', base: [12000, 18000] }, { t: '60분', base: [20400, 30600] }, { t: '90분', base: [28800, 43200] }];
  }
  renderVals() {
    const s = this.state, d = this.D[s.dog], l = this.L[s.len];
    const won = (n) => n.toLocaleString('ko-KR') + '원';
    return {
      dog: d.name, dogJosa: d.josa, dogPhoto: d.photo, dogFocus: d.focus,
      dogs: this.D.map((x, i) => ({ name: x.name, on: i === s.dog, pick: () => this.setState({ dog: i }) })),
      nextDog: () => this.setState({ dog: (s.dog + 1) % this.D.length }),
      dateText: '11월 7일 토요일',
      timeText: this.T[s.time],
      nextTime: () => this.setState({ time: (s.time + 1) % this.T.length }),
      len: l.t,
      nextLen: () => this.setState({ len: (s.len + 1) % this.L.length }),
      count: 5,
      priceRange: won(l.base[0]) + '에서 ' + won(l.base[1])
    };
  }
}
</script>
</body>
</html>
