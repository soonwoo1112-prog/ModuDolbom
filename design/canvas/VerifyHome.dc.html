<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>동네 인증</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="modudolbom.css">
<link rel="stylesheet" href="ds/modudolbom/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--fg-brand)}a:hover{color:var(--fg-brand)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg-layer-default); color: var(--fg-neutral); font-family: var(--font-sans); overflow: hidden;">
<header class="md-topnav"><a class="md-iconbtn md-pressable" href="VerifyPhone.dc.html" aria-label="뒤로 가기"><svg class="md-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></a><h1 class="md-topnav__title"></h1><span class="ac-step md-num">3/3</span></header>
<main class="ac-main">
<h2 class="md-screen-title">사는 동네를 인증해 주세요</h2>
<p class="ac-sub">같은 동네 이웃끼리만 산책을 주고받아요</p>
<div class="ac-map" aria-hidden="true"><span class="ac-map__dot"></span><span class="ac-map__ring"></span></div>
<div class="ac-card"><span class="ac-card__ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></svg></span><span><b>지금 계신 곳은 역삼동이에요</b><small>휴대폰 위치로 확인했어요</small></span><sc-if value="{{dongDone}}" hint-placeholder-val="{{ false }}"><span class="md-badge md-badge--brand">인증됨</span></sc-if></div>
<sc-if value="{{dongDone}}" hint-placeholder-val="{{ false }}">
<section class="ac-apt">
<h3 class="ac-h3">같은 아파트도 인증할까요? <em>선택</em></h3>
<p class="ac-sub" style="margin: 0;">같은 단지 이웃에게 "같은 아파트" 배지가 보여요. 동과 호수는 확정된 산책에서만 보여요.</p>
<label class="ac-search"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg><input class="md-input" placeholder="아파트 이름이나 도로명" value="{{q}}" onChange="{{typeQ}}"></label>
<sc-if value="{{hasResult}}" hint-placeholder-val="{{ true }}"><button class="ac-result md-pressable" type="button" aria-pressed="{{aptPicked}}" onClick="{{pickApt}}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2" ry="2" /><path d="M9 22v-4h6v4" /><path d="M8 6h.01" /><path d="M16 6h.01" /><path d="M12 6h.01" /><path d="M12 10h.01" /><path d="M12 14h.01" /><path d="M16 10h.01" /><path d="M16 14h.01" /><path d="M8 10h.01" /><path d="M8 14h.01" /></svg><span><b>역삼로 123 아파트</b><small>서울 강남구 역삼로 123</small></span></button></sc-if>
</section>
</sc-if>
</main>
<div class="ac-cta">
<sc-if value="{{notDong}}" hint-placeholder-val="{{ true }}"><button class="md-btn md-btn--brand md-btn--large md-pressable" type="button" onClick="{{certify}}">역삼동으로 인증하기</button></sc-if>
<sc-if value="{{dongDone}}" hint-placeholder-val="{{ false }}"><a class="md-btn md-btn--brand md-btn--large md-pressable" href="{{next}}" style="box-sizing: border-box;">{{nextLabel}}</a><a class="md-btn md-btn--ghost md-pressable" href="{{next}}" style="min-height: 44px;">아파트는 나중에 할게요</a></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dong: false, q: '', apt: false };
  }
  renderVals() {
    const s = this.state;
    let role = 'guardian';
    try { role = sessionStorage.getItem('md-role') || 'guardian'; } catch (e) { role = 'guardian'; }
    const next = role === 'sitter' ? 'SitterAccount.dc.html' : 'MainRNew.dc.html';
    return {
      dongDone: s.dong, notDong: !s.dong,
      certify: () => this.setState({ dong: true }),
      q: s.q, typeQ: (e) => this.setState({ q: e.target.value }),
      hasResult: s.q.trim().length > 0, aptPicked: s.apt, pickApt: () => this.setState({ apt: !s.apt }),
      next: next,
      nextLabel: s.apt ? '같은 아파트까지 인증하기' : (role === 'sitter' ? '다음' : '시작하기')
    };
  }
}
</script>
</body>
</html>
